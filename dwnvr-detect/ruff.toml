# ruff: lint and formatting of dwnvr-detect's Python. It runs through the hook in
# .pre-commit-config.yaml, and the editor reads this same file.

# The image's (Dockerfile).
target-version = "py312"
# Without the 88 limit: the rest of the repository doesn't limit lines (MD013
# and yamllint's line-length off), and 120 only breaks what is too long.
line-length = 120
