# ruff: lint e formatação do Python do dwnvr-detect. Roda pelo hook do
# .pre-commit-config.yaml, e o editor lê este mesmo arquivo.

# A da imagem (Dockerfile).
target-version = "py312"
# Sem o limite de 88: o resto do repositório não limita linha (MD013 e
# line-length do yamllint desligados), e o 120 só quebra o que é longo demais.
line-length = 120
