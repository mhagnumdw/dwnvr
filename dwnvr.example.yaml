# Configuração de infraestrutura do dwnvr.
#
# Este arquivo é editado à mão e NUNCA é reescrito pela aplicação — seus
# comentários estão seguros. A lista de câmeras fica em cameras.json, ao lado
# deste arquivo, porque é ela que a tela de cadastro precisa gravar.

server:
  listen: ":8080"

go2rtc:
  # O dwnvr apenas consome o go2rtc; configurá-lo continua sendo tarefa sua.
  url: http://localhost:1984
  # Preencha se a API do go2rtc estiver protegida. A credencial fica no
  # servidor: o navegador fala com o dwnvr, que faz o proxy.
  # username: admin
  # password: troque-me

storage:
  root: /mnt/storage/dwnvr

  # Rede de segurança global. Quando o disco livre cai abaixo disto, o dwnvr
  # evicta as gravações mais antigas de TODAS as câmeras, ignorando as cotas
  # individuais. Existe porque a soma das cotas erra fácil — cada câmera tem
  # uma taxa diferente — e encher o disco é pior que perder gravação antiga.
  minFreeMB: 2048

  # Recusa subir se root estiver no mesmo sistema de arquivos da raiz. Ligue
  # quando as gravações forem para um disco externo: se ele desmontar, sem isto
  # o dwnvr passaria a encher o cartão SD do sistema sem ninguém perceber.
  # Deixe desligado em instalações de disco único.
  requireSeparateDisk: false

# Aplicados a qualquer câmera que não defina o campo.
defaults:
  # Duração alvo do segmento. O corte real acontece no primeiro keyframe depois
  # deste tempo, então com GOP de 4s um alvo de 60s vira ~60-64s na prática.
  segmentSeconds: 60

  # Cota em disco por câmera. Ao estourar, os segmentos mais antigos daquela
  # câmera são apagados (ring buffer). A tela de cadastro traduz este número
  # em "≈ N dias" usando a taxa medida de cada câmera.
  quotaMB: 10240

  # Idade máxima em dias, opcional. 0 = sem limite, quem manda é a cota.
  maxDays: 0

  # none  descarta o áudio na origem, custo zero
  # flac  go2rtc converte pcm_alaw→FLAC em Go puro, sem disparar ffmpeg (~1-2% de core)
  # aac   exige uma fonte "ffmpeg:cam#audio=aac" no go2rtc.yaml (~10% de core)
  audio: none
