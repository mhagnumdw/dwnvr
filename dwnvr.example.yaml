# dwnvr infrastructure configuration.
#
# This file is edited by hand and NEVER rewritten by the application, so your
# comments are safe. The camera list lives in cameras.json, next to this file,
# because it is what the camera form needs to write.

server:
  listen: ":8080"
  # With both empty, authentication is off. That is on purpose, so the first
  # run is not blocked, and dwnvr warns about it in the log. Fill them in on a
  # permanent installation: without them, anyone who opens the UI sees the
  # recordings of every camera.
  #
  # This is the owner account: always an administrator, and its password can
  # only be changed here. You create the other people in the "Usuários" tab of
  # the UI, which saves them to users.json, next to this file.
  # username: admin
  # password: troque-me

  # Login attempt limit per address: 5 in a row and, after that, this many per
  # minute. 0 turns it off; the accepted range is 0 to 12. See
  # docs/configuration.md, "Login attempt limit".
  # loginAttemptsPerMinute: 2

  # The proxies whose X-Forwarded-For carries the real address of whoever is
  # trying to log in. The default covers `tailscale serve` and the compose
  # Caddy; change it only if your proxy reaches dwnvr through another network.
  # [] trusts nobody.
  # trustedProxies: [127.0.0.0/8, "::1/128", 172.16.0.0/12]

  # Optional. The address you open dwnvr at, as in the browser bar. With it,
  # the alert e-mail carries the button that opens the recording at the right
  # moment. Without it, nothing stops working: the e-mail goes out without the
  # button and asks the administrator to set it. See docs/configuration.md,
  # "The dwnvr address".
  # publicUrl: https://dwnvr.exemplo.ts.net

go2rtc:
  # dwnvr only consumes go2rtc; configuring it is still your job.
  #
  # "go2rtc" is the service name in docker-compose.yml, and Docker resolves it
  # to the neighboring container. Running the bare binary, outside compose,
  # change it to the address of your go2rtc, for example http://localhost:1984.
  url: http://go2rtc:1984
  # Fill in if the go2rtc API is protected. The credential stays on the
  # server: the browser talks to dwnvr, which proxies.
  # username: admin
  # password: troque-me

# The object detector, optional: the dwnvr-detect container, which tells
# whether the marked motion was a person, a vehicle or an animal. Without it,
# cameras with `detect` on mark motion only.
#
# It costs real CPU and RAM - ~6.5 s of one core and ~210 MB per look on the
# Orange Pi Zero 3 - and it only looks at cameras with `detect` on. See
# docs/configuration.md.
# detector:
#   url: http://dwnvr-detect:8480

# The mail server, optional: it is how the set-password link goes straight to
# the person, from the "Usuários" screen. Any provider that speaks SMTP will
# do; without this section, dwnvr sends no e-mail at all. A broken section
# does not stop dwnvr from starting: e-mail stays off, and the reason goes to
# the log and to the warnings on the "Diagnóstico" screen. The test lives in
# the "Este servidor" card there. See docs/configuration.md, "E-mail", with
# the Gmail walkthrough.
# smtp:
#   host: smtp.gmail.com
#   # starttls (the default, port 587), tls (port 465) or none (port 25, no
#   # TLS: with login, only for a server on the same machine).
#   security: starttls
#   # port: 587
#   # The account that sends; both together, or neither if the server does not
#   # ask for login. On Gmail, the password is an app password, not the
#   # account one.
#   username: dwnvr.exemplo@gmail.com
#   password: troque-me
#   # The sender. Empty uses the username.
#   # from: "dwnvr <dwnvr.exemplo@gmail.com>"

# Who receives by e-mail the detection alert of every camera with alerts on
# ("Alerta" tab of the camera form), in a single message for everyone.
# Optional, and only useful with the smtp section above. Address only, no name
# in front: anything that is not an address is left out of the list and becomes
# a warning in "Diagnóstico". A single address also works without the brackets
# (to: fulano@exemplo.com). See docs/configuration.md, "E-mail alerts".
# alerts:
#   email:
#     to: [fulano@exemplo.com, ciclana@exemplo.com]

storage:
  # Where dwnvr writes - the path the process sees. In a container it is a
  # path inside it, and the host disk is chosen by the volume in
  # docker-compose.yml.
  #
  # It is the only field that stops dwnvr from starting when empty. A number
  # out of range, here or in `defaults`, falls back to the default and becomes
  # a warning in the log and on the "Diagnóstico" screen, with what is
  # accepted.
  root: /storage

  # Global safety net. When free disk drops below this, dwnvr evicts the
  # oldest recordings of ALL cameras, ignoring the individual quotas. It
  # exists because the sum of the quotas is easy to get wrong - each camera has
  # a different bitrate - and filling the disk is worse than losing old
  # recordings.
  minFreeMB: 2048

# Applied to any camera that does not set the field.
defaults:
  # Target segment duration. The actual cut happens at the first keyframe after
  # this time, so with a 4s GOP a 30s target becomes ~30-34s in practice.
  #
  # An open segment is not in the index yet: this number is the ceiling of what
  # is lost in a power outage. It is also the size of the file the player
  # downloads whole on every seek. Raising it trades those two things for fewer
  # files on disk. Accepted: 10 to 300.
  segmentSeconds: 30

  # Per-camera disk quota. When exceeded, that camera's oldest segments are
  # deleted (ring buffer). The camera form translates this number into
  # "≈ N dias" using each camera's measured bitrate. Minimum: 100.
  quotaMB: 10240

  # Maximum age in days, optional. 0 = no limit, the quota rules.
  maxDays: 0

  # none  drops the audio at the source, zero cost
  # flac  go2rtc converts pcm_alaw→FLAC in pure Go, no ffmpeg spawned (~1-2% of a core)
  # aac   requires an "ffmpeg:cam#audio=aac" source in go2rtc.yaml (~10% of a core)
  audio: none

  # Seconds without receiving a single byte before the stream is considered
  # dead, the connection is dropped and it reconnects.
  #
  # This is not fussiness: when a go2rtc RTSP producer dies, it stops writing
  # WITHOUT closing the HTTP response. Without this threshold the camera
  # silently stops recording, with no error and no log, until someone notices.
  # Closing the connection is also what recovers it - go2rtc drops the dead
  # producer when the last consumer leaves and opens a new RTSP session on
  # reconnect.
  #
  # Raise it on a bad link; accepted 1 to 3600. Zero does not turn the
  # protection off: it falls back to the default.
  stallSeconds: 15

  # --- motion marking on the timeline ---
  #
  # Turns on the trigger that finds the moments when the image changed enough
  # to be worth a look. It is CHEAP: the signal is the size of each frame,
  # which the recorder already has at hand, and no pixel is decoded.
  #
  # With it on, the timeline gets the heat strip, which shows WHEN there was
  # motion. Saying WHAT it was - person, vehicle, animal - is the job of the
  # object detector, the `detector` section above, and it is optional. It
  # comes off: whoever did not ask for it does not pay.
  detect: false

  # kleinberg-p  statistical: fires when the frame deviates from THAT camera's
  #              normal. Measured against 23 competitors on real recordings
  #              and beat them all - catches 2 to 3 times more than periodic
  #              at the same cost.
  # periodic     fires at a fixed interval, ignoring the image. Same cost and
  #              perfectly predictable; catches far less.
  detectMethod: kleinberg-p

  # From 1 to 5, and what it controls is the COST - how many times per hour,
  # PER CAMERA, dwnvr stops to look. Multiply by the number of cameras.
  #
  #   1 very low     6 marks/hour   catches  2.8% of what passes
  #   2 low         12 marks/hour   catches  9.2%
  #   3 medium      25 marks/hour   catches 22.3%
  #   4 high        50 marks/hour   catches 41.5%
  #   5 very high  100 marks/hour   catches 57.4%   <- default
  #
  # Both columns are measured, not estimated: see docs/configuration.md.
  detectSensitivity: 5
