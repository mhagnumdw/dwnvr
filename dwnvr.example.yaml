# Configuração de infraestrutura do dwnvr.
#
# Este arquivo é editado à mão e NUNCA é reescrito pela aplicação - seus
# comentários estão seguros. A lista de câmeras fica em cameras.json, ao lado
# deste arquivo, porque é ela que a tela de cadastro precisa gravar.

server:
  listen: ":8080"
  # Com os dois vazios a autenticação fica desligada, o que é proposital para
  # não travar o primeiro uso - e o dwnvr avisa disso no log. Preencha numa
  # instalação definitiva: sem definir, quem abre a interface enxerga as
  # gravações de todas as câmeras.
  # username: admin
  # password: troque-me

go2rtc:
  # O dwnvr apenas consome o go2rtc; configurá-lo continua sendo tarefa sua.
  #
  # "go2rtc" é o nome do serviço no docker-compose.yml, e o Docker o resolve
  # para o container vizinho. Rodando o binário solto, fora do compose, troque
  # pelo endereço do seu go2rtc, exemplo: http://localhost:1984.
  url: http://go2rtc:1984
  # Preencha se a API do go2rtc estiver protegida. A credencial fica no
  # servidor: o navegador fala com o dwnvr, que faz o proxy.
  # username: admin
  # password: troque-me

storage:
  # Onde o dwnvr escreve - o caminho que o processo enxerga. Em container é um
  # caminho de dentro dele, e quem escolhe o disco do host é o volume do
  # docker-compose.yml.
  root: /storage

  # Rede de segurança global. Quando o disco livre cai abaixo disto, o dwnvr
  # evicta as gravações mais antigas de TODAS as câmeras, ignorando as cotas
  # individuais. Existe porque a soma das cotas erra fácil - cada câmera tem
  # uma taxa diferente - e encher o disco é pior que perder gravação antiga.
  minFreeMB: 2048

# Aplicados a qualquer câmera que não defina o campo.
defaults:
  # Duração alvo do segmento. O corte real acontece no primeiro keyframe depois
  # deste tempo, então com GOP de 4s um alvo de 30s vira ~30-34s na prática.
  #
  # Segmento aberto ainda não está no índice: este número é o teto do que se
  # perde numa queda de energia. Também é o tamanho do arquivo que o player
  # baixa inteiro a cada seek. Aumentar troca essas duas coisas por menos
  # arquivos em disco.
  segmentSeconds: 30

  # Cota em disco por câmera. Ao estourar, os segmentos mais antigos daquela
  # câmera são apagados (ring buffer). A tela de cadastro traduz este número
  # em "≈ N dias" usando a taxa medida de cada câmera.
  quotaMB: 10240

  # Idade máxima em dias, opcional. 0 = sem limite, quem manda é a cota.
  maxDays: 0

  # none  descarta o áudio na origem, custo zero
  # flac  go2rtc converte pcm_alaw→FLAC em Go puro, sem disparar ffmpeg (~1-2% de core)
  # aac   exige uma fonte "ffmpeg:cam#audio=aac" no go2rtc.yaml (~10% de core)
  audio: none

  # Segundos sem receber um único byte antes de considerar o stream morto,
  # derrubar a conexão e reconectar.
  #
  # Não é firula: quando um produtor RTSP do go2rtc morre, ele para de escrever
  # SEM fechar a resposta HTTP. Sem este limiar a câmera para de gravar em
  # silêncio, sem erro e sem log, até alguém reparar. Fechar a conexão também é
  # o que recupera - o go2rtc derruba o produtor morto quando o último
  # consumidor sai e abre uma sessão RTSP nova na reconexão.
  #
  # Aumente num enlace ruim; não pode ser 0, que seria desligar a proteção.
  stallSeconds: 15
