# Hooks do pre-commit (https://pre-commit.com). Rodam a cada commit, nos
# arquivos do commit, e corrigem o que dá para corrigir. Quando um hook corrige
# algo, o commit é interrompido: confira, dê `git add` e commite de novo.
#
# Uma vez por clone: `pre-commit install` (a versão está no .tool-versions).
# Rodar em tudo, como a CI: `pre-commit run --all-files`
#
# A CI roda este mesmo arquivo (.github/workflows/lint.yml) e não corrige
# nada: se um hook mudaria algum arquivo, o job falha e mostra o diff.

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

# O que é gerado, e por isso nunca editado à mão, fica fora de todo hook. O
# internal/api/dist/ sai do `npm run build`, e o ci.yml o compara com um build
# novo; o CHANGELOG.md é escrito pela release. Um hook que os "consertasse"
# quebraria as duas coisas.
exclude: ^(internal/api/dist/|CHANGELOG\.md$)

repos:
  # Higiene de qualquer arquivo texto. Binário fica de fora sozinho.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
        exclude: ^\.vscode/  # JSONC: o VS Code aceita comentário
      - id: check-toml
      # Arquivo acima de 500 KB interrompe o commit: modelo, vídeo ou quadro
      # de câmera entrando sem querer. Quando for de propósito:
      # SKIP=check-added-large-files git commit ... e o arquivo entra no
      # exclude. O --enforce-all confere todo arquivo que o hook recebe, e não
      # só o novo no staged: sem ele, na CI, que não tem staged, o hook não
      # confere nada.
      - id: check-added-large-files
        args: [--enforce-all]
        exclude: ^dwnvr-detect/modelo/rfdetr-n_512x288_int8\.onnx$
      - id: detect-private-key

  # Markdown. As regras estão no .markdownlint-cli2.yaml. O --no-globs faz o
  # hook olhar só os arquivos do commit, e não o `globs` da config, que é o
  # repositório inteiro.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: [--no-globs, --fix]

  # Link e âncora do Markdown, sem rede. As regras estão no lychee.toml. Roda
  # pela imagem oficial, então precisa de Docker. O hook `lychee` evitaria o
  # Docker, mas instala o binário rodando no bash um script baixado do branch
  # main de outro repositório, que pode mudar a qualquer hora. O `entry` fixa
  # a tag da imagem, que o hook traz atrasada.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee-docker
        entry: docker.io/lycheeverse/lychee:0.24.2-alpine
        types: [markdown]

  # YAML: workflows, compose e configs. As regras estão no .yamllint.yaml, e o
  # --strict faz aviso também interromper o commit.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # Dockerfiles, com o shellcheck nos RUN. Roda pela imagem oficial, então
  # precisa de Docker. O `entry` repete o do hook para fixar a tag: o original
  # usa a imagem sem tag, que muda sozinha.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint

  # Workflows do GitHub Actions: sintaxe, expressões e o shellcheck nos `run:`.
  # Roda pela imagem oficial, que já traz o shellcheck e vem com a tag fixada.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

  # Go: bug (errcheck, govet, staticcheck, unused...) e formatação (gofmt e
  # goimports). As regras estão no .golangci.yml. O -full olha o módulo
  # inteiro: o hook comum só olha o que mudou desde o HEAD, e na CI não acharia
  # nada. Ele é compilado com o Go do PATH.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint-full
      - id: golangci-lint-fmt
      - id: golangci-lint-config-verify

  # go.mod e go.sum de acordo com os imports: dependência que falta entra, a
  # que sobra sai.
  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy
        language: system
        entry: go mod tidy
        files: (\.go|^go\.mod|^go\.sum)$
        pass_filenames: false

  # Svelte: os warnings do compilador (acessibilidade, CSS sem uso). Tipo do
  # JavaScript ele não confere: o web/ não tem jsconfig.json com checkJs. Roda
  # no web/ inteiro, e o svelte-check vem das devDependencies do web/, como o
  # ESLint abaixo: em clone novo, antes rode `npm ci` no web/.
  - repo: local
    hooks:
      - id: svelte-check
        name: svelte-check
        language: system
        entry: web/node_modules/.bin/svelte-check --workspace web --fail-on-warnings
        files: ^web/(src/|svelte\.config\.js$|vite\.config\.js$)
        pass_filenames: false

  # JavaScript e Svelte: bug e má prática. As regras estão no
  # web/eslint.config.js, e o ESLint vem das devDependencies do web/: em clone
  # novo, antes rode `npm ci` no web/. O --no-warn-ignored cala o aviso sobre o
  # src/vendor/, que a config deixa de fora. O --max-warnings=0 faz warning
  # interromper o commit: no recommended, o `$inspect` e o `{@debug}`
  # esquecidos são só warning.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: web/node_modules/.bin/eslint
        args: [--fix, --no-warn-ignored, --max-warnings=0]
        files: ^web/(src/.*\.(js|svelte)|[^/]+\.js)$
