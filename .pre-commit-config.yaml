# Hooks do prek (https://prek.j178.dev), que lê o formato do pre-commit. Rodam
# a cada commit, nos arquivos do commit, e corrigem o que dá para corrigir.
# Quando um hook corrige algo, o commit é interrompido: confira, dê `git add` e
# commite de novo.
#
# Uma vez por máquina: `uv tool install prek`. Uma vez por clone:
# `prek install`. Rodar em tudo, como a CI: `prek run --all-files`
#
# A CI roda este mesmo arquivo (.github/workflows/lint.yml) e não corrige
# nada: se um hook mudaria algum arquivo, o job falha e mostra o diff.
#
# O arquivo é só do prek: o pre-commit recusa o `default_language_version` em
# forma de mapa, e não conhece o `priority`, o `priorities` e o
# `minimum_prek_version`.

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

# A versão que a CI instala. Um prek mais velho que ela se recusa a rodar.
minimum_prek_version: '0.5.3'

# O Go dos hooks em Go (golangci-lint e betterleaks), que o prek baixa e guarda
# no cache dele, e não o Go do PATH. Com o asdf, o do PATH é um shim que, na
# pasta do hook, cai no Go global, e cada chamada ao `go` fica mais lenta. É o
# Go do go.mod: compilado com um mais velho, o golangci-lint se recusa a rodar.
# Mudou aqui, o prek monta o ambiente de novo sozinho.
default_language_version:
  golang:
    request: '1.27.1'
    preference: only-managed

# A ordem dos hooks. Os de mesmo `priority` rodam juntos, e o valor seguinte
# só começa quando o anterior termina. Primeiro os fixers de texto, de 0 a 3,
# um por vez, porque mexem nos mesmos arquivos. Depois os formatadores, juntos,
# cada um no seu tipo de arquivo. Depois o que lê o que eles acabaram de
# escrever. Por fim, juntos, todos os que só conferem. Todo hook tem o seu, e
# hook novo entra numa dessas ondas.
priorities:
  formatar: 10
  formatar-depois: 11
  conferir: 20

# O que é gerado, e por isso nunca editado à mão, fica fora de todo hook. O
# internal/api/dist/ sai do `npm run build`, e o ci.yml e o hook
# interface-atualizada, abaixo, o comparam com um build novo; o CHANGELOG.md é
# escrito pela release. Um hook que os "consertasse" quebraria as duas coisas.
exclude: ^(internal/api/dist/|CHANGELOG\.md$)

repos:
  # Higiene de qualquer arquivo texto. Binário fica de fora sozinho.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        priority: 0
      - id: end-of-file-fixer
        priority: 1
      - id: mixed-line-ending
        priority: 2
        args: [--fix=lf]
      - id: fix-byte-order-marker
        priority: 3
      - id: check-merge-conflict
        priority: conferir
      - id: check-case-conflict
        priority: conferir
      - id: check-yaml
        priority: conferir
      - id: check-json
        priority: conferir
        # JSONC: o VS Code e o TypeScript aceitam comentário
        exclude: ^(\.vscode/|web/tsconfig[^/]*\.json$)
      - id: check-toml
        priority: conferir
      # Arquivo acima de 500 KB interrompe o commit: modelo, vídeo ou quadro
      # de câmera entrando sem querer. Quando for de propósito:
      # SKIP=check-added-large-files git commit ... e o arquivo entra no
      # exclude. O --enforce-all confere todo arquivo que o hook recebe, e não
      # só o novo no staged: sem ele, na CI, que não tem staged, o hook não
      # confere nada.
      - id: check-added-large-files
        priority: conferir
        args: [--enforce-all]
        exclude: ^dwnvr-detect/modelo/rfdetr-n_512x288_int8\.onnx$
      - id: detect-private-key
        priority: conferir

  # Arquivo acima de 5000 tokens (bytes/4, a conta aproximada) interrompe o
  # commit. O limite é escolha de organização, não de capacidade: o agente lê
  # arquivo maior, mas gasta contexto com o que não é da tarefa, e um arquivo
  # por assunto se acha pelo nome. A conta é do staged, não do working tree.
  # O arquivo que já passava do limite no HEAD pode continuar, desde que não
  # cresça: o hook barra o arquivo novo grande e o grande que engorda, e a
  # divisão do que já existe fica para quando alguém o tocar. Por isso, na
  # CI, onde o staged é o próprio HEAD, ele não acha nada. Fica de fora o que
  # ninguém escreve à mão nem por agente: lockfile (go.sum,
  # package-lock.json), código de terceiros copiado (web/src/vendor/) e o
  # gerado do `exclude` global.
  - repo: local
    hooks:
      - id: limite-de-tokens
        priority: conferir
        name: arquivo até 5000 tokens
        language: system
        types: [text]
        exclude: ^(go\.sum|web/package-lock\.json|web/src/vendor/)
        # Uma chamada só, com todos os arquivos: sem isso o prek divide em
        # lotes paralelos, e as instruções saem uma vez por lote.
        require_serial: true
        entry: |
          bash -c '
            set -eu
            limite=5000
            barrados=""
            for f in "$@"; do
              bytes=$(git cat-file -s ":$f" 2>/dev/null || wc -c < "$f")
              tokens=$((bytes / 4))
              [ "$tokens" -gt "$limite" ] || continue
              antes=$(git cat-file -s "HEAD:$f" 2>/dev/null || echo 0)
              if [ $((antes / 4)) -gt "$limite" ]; then
                [ "$bytes" -gt "$antes" ] || continue
                barrados="$barrados  $f: $tokens tokens ($bytes bytes), já passava do limite e cresceu $((bytes - antes)) bytes\n"
              else
                barrados="$barrados  $f: $tokens tokens ($bytes bytes)\n"
              fi
            done
            [ -n "$barrados" ] || exit 0
            echo "Arquivo acima de $limite tokens (bytes/4, até $((limite * 4)) bytes) no commit:"
            printf "%b\n" "$barrados"
            cat <<"FIM"
          Arquivo grande mistura assuntos: para mexer num deles, o agente gasta
          contexto lendo os outros e edita sem ver quem depende do trecho.
          Arquivo pequeno, com um assunto só, se acha pelo nome e se lê
          inteiro. Divida antes de commitar:

          1. Liste as responsabilidades do arquivo (cada tipo, tela, etapa ou
             assunto) e mova cada uma, inteira, para um arquivo próprio, com um
             nome que diga o que ela é. Não corte uma função no meio para caber,
             e não tire comentário nem compacte o código só para baixar a conta.
          2. Conforme o tipo:
             - .go: arquivo novo no mesmo pacote e com o mesmo `package`, então
               quem usa o pacote não muda nada. O import vale por arquivo: cada
               um declara o que usa (o goimports do hook golangci-lint-fmt
               ajusta). Um por tipo ou assunto, por exemplo
               server.go -> server.go + rotas_gravacoes.go. O _test.go segue o
               código que testa (store_test.go -> store_test.go +
               indice_test.go), e o ajudante de teste que os dois usam vai para
               um ajudantes_test.go.
             - .svelte: o pedaço da tela com marcação própria vira componente em
               web/src/components/ (dados entram por props, ações saem por
               callback); estado e lógica sem marcação vão para um .svelte.ts em
               web/src/lib/.
             - .ts: um módulo por assunto em web/src/lib/, e quem importava passa
               a importar do módulo novo.
             - .py: um módulo por assunto, na mesma pasta.
             - .md: a seção grande vira um documento próprio em docs/, e o
               original fica com um resumo de duas linhas e o link. Link e
               âncora que apontavam para a seção passam a apontar para o arquivo
               novo.
          3. Confira na §Repercussões do AGENTS.md o que acompanha o arquivo novo
             ou movido (§Estrutura do web/README.md, árvore do README.md, índice
             docs/README.md, links relativos).
          4. Cada arquivo que sobrar abaixo do limite: wc -c ARQUIVO (em bytes, até
             20000). Depois git add do original e dos novos, e commite de novo.

          Arquivo que já passava do limite no HEAD pode ficar como está, mas não
          crescer: a mudança que o engorda é a hora de dividi-lo.

          Arquivo que não é escrito à mão nem por agente (lockfile, código gerado,
          código de terceiros copiado) entra no exclude do hook limite-de-tokens
          no .pre-commit-config.yaml, com o motivo. Nunca git commit --no-verify.
          FIM
            exit 1
          ' --

  # Markdown. As regras estão no .markdownlint-cli2.yaml. O --no-globs faz o
  # hook olhar só os arquivos do commit, e não o `globs` da config, que é o
  # repositório inteiro.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        priority: formatar
        args: [--no-globs, --fix]

  # Link e âncora do Markdown, sem rede. As regras estão no lychee.toml. Roda
  # pela imagem oficial, então precisa de Docker. O hook `lychee` evitaria o
  # Docker, mas instala o binário rodando no bash um script baixado do branch
  # main de outro repositório, que pode mudar a qualquer hora. O `entry` fixa
  # a tag da imagem, que o hook traz atrasada.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee-docker
        priority: conferir
        entry: docker.io/lycheeverse/lychee:0.24.2-alpine
        types: [markdown]

  # YAML: workflows, compose e configs. As regras estão no .yamllint.yaml, e o
  # --strict faz aviso também interromper o commit.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        priority: conferir
        args: [--strict]

  # Dockerfiles, com o shellcheck nos RUN. Roda pela imagem oficial, então
  # precisa de Docker. O `entry` repete o do hook para fixar a tag: o original
  # usa a imagem sem tag, que muda sozinha.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        priority: conferir
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint

  # Workflows do GitHub Actions: sintaxe, expressões e o shellcheck nos `run:`.
  # Roda pela imagem oficial, que já traz o shellcheck e vem com a tag fixada.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
        priority: conferir

  # Segurança dos workflows: action sem SHA, permissão ampla, credencial
  # exposta. As regras estão no .github/zizmor.yml. No clone roda offline; a
  # CI lhe passa um token, que liga os audits que consultam o GitHub.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        priority: conferir

  # Segredo no commit: token, chave e senha de câmera na URL rtsp://. As
  # regras estão no .betterleaks.toml. O binário é compilado com o Go do
  # default_language_version, acima.
  #
  # O primeiro olha só o staged, e a CI o pula (o SKIP do lint.yml). O
  # segundo, só na CI, olha o histórico inteiro: pega o que entrou sem passar
  # pelo hook (editor do GitHub, clone sem `prek install`). À mão:
  # prek run betterleaks-historico --stage manual --all-files
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.8.1
    hooks:
      - id: betterleaks
        priority: conferir
      - id: betterleaks
        priority: conferir
        alias: betterleaks-historico
        name: betterleaks no histórico
        entry: betterleaks git --redact --verbose
        stages: [manual]

  # Go: bug (errcheck, govet, staticcheck, unused...) e formatação (gofmt e
  # goimports). As regras estão no .golangci.yml. O -full olha o módulo
  # inteiro: o hook comum só olha o que mudou desde o HEAD, e na CI não acharia
  # nada. Ele é compilado com o Go do default_language_version, acima.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint-full
        priority: conferir
      - id: golangci-lint-fmt
        priority: formatar
      - id: golangci-lint-config-verify
        priority: conferir

  # go.mod e go.sum de acordo com os imports: dependência que falta entra, a
  # que sobra sai.
  - repo: local
    hooks:
      - id: go-mod-tidy
        priority: formatar-depois
        name: go mod tidy
        language: system
        entry: go mod tidy
        files: (\.go|^go\.mod|^go\.sum)$
        pass_filenames: false

  # TypeScript e Svelte: os tipos e os warnings do compilador (acessibilidade,
  # CSS sem uso). O svelte-check confere a tela pelo web/tsconfig.app.json, e
  # o tsc as configs das ferramentas pelo web/tsconfig.node.json: o tsc
  # sozinho não lê .svelte. É o `npm run check` do web/, em dois hooks. Rodam
  # no web/ inteiro, porque mudar um tipo quebra quem o usa em outro arquivo,
  # e vêm das devDependencies do web/, como o ESLint abaixo: em clone novo,
  # antes rode `npm ci` no web/.
  - repo: local
    hooks:
      - id: svelte-check
        priority: conferir
        name: svelte-check
        language: system
        entry: web/node_modules/.bin/svelte-check --workspace web --tsconfig tsconfig.app.json --fail-on-warnings
        files: ^web/(src/|tsconfig[^/]*\.json$|package\.json$)
        pass_filenames: false
      - id: tsc-configs
        priority: conferir
        name: tsc das configs do web/
        language: system
        entry: web/node_modules/.bin/tsc -p web/tsconfig.node.json
        files: ^web/([^/]+\.ts|tsconfig[^/]*\.json|package\.json)$
        pass_filenames: false

  # O internal/api/dist/ do commit corresponde ao web/ do commit? É o passo
  # "interface está atualizada?" do ci.yml, aqui antes do push: o commit da
  # tela sem o build refeito sobe um binário que serve a tela antiga. O build
  # vai para uma pasta temporária, e o resultado se compara com o staged, sem
  # tocar no dist do clone: o hook só reprova. Os arquivos novos contam, porque
  # cada build troca os nomes com hash. O Vite roda de dentro do web/, como no
  # `npm run build`: rodado da raiz, os hashes saem outros. Vem do
  # web/node_modules, então o build só bate com o da CI se o node_modules
  # estiver de acordo com o package-lock.json: em dúvida, `npm ci` no web/.
  - repo: local
    hooks:
      - id: interface-atualizada
        priority: conferir
        name: interface está atualizada?
        language: system
        entry: |
          bash -c '
            set -eu
            tmp=$(mktemp -d)
            trap "rm -rf $tmp" EXIT
            (cd web && node_modules/.bin/vite build --outDir "$tmp/internal/api/dist" --emptyOutDir --logLevel warn)
            cp "${GIT_INDEX_FILE:-$(git rev-parse --git-path index)}" "$tmp/index"
            # Só a segunda coluna, a do build contra o staged. A primeira é a
            # do staged contra o HEAD, que num commit da tela muda mesmo.
            difere=$(GIT_INDEX_FILE="$tmp/index" git --work-tree="$tmp" status --porcelain --no-renames --untracked-files=all -- internal/api/dist | grep -v "^. " || true)
            if [ -n "$difere" ]; then
              echo "internal/api/dist não corresponde ao web/ do commit. Refaça o build e adicione o resultado:"
              echo "  (cd web && npm run build) && git add internal/api/dist"
              echo
              echo "Como fica o dist staged depois do build (D sai, ?? entra, M muda):"
              echo "$difere"
              exit 1
            fi
          '
        files: ^web/(src/|public/|index\.html$|package(-lock)?\.json$|vite\.config\.ts$)
        pass_filenames: false

  # TypeScript e Svelte: bug e má prática, com as regras que leem os tipos. As
  # regras estão no web/eslint.config.ts, e o ESLint vem das devDependencies
  # do web/: em clone novo, antes rode `npm ci` no web/. O --no-warn-ignored
  # cala o aviso sobre o src/vendor/, que a config deixa de fora. O
  # --max-warnings=0 faz warning interromper o commit: no recommended, o
  # `$inspect` e o `{@debug}` esquecidos são só warning.
  - repo: local
    hooks:
      - id: eslint
        priority: formatar
        name: eslint
        language: system
        entry: web/node_modules/.bin/eslint
        args: [--fix, --no-warn-ignored, --max-warnings=0]
        files: ^web/(src/.*\.(ts|svelte)|[^/]+\.ts)$

  # TypeScript, Svelte, CSS e o index.html do web/: a formatação. As regras
  # estão no web/prettier.config.ts. Vem depois do ESLint, porque o --fix dele
  # pode deixar linha fora do formato, e assim o Prettier tem a última palavra.
  # O --ignore-path aponta o .prettierignore do web/, que o Prettier só procura
  # na pasta de onde é chamado, e aqui é a raiz. O Prettier vem das
  # devDependencies do web/: em clone novo, antes rode `npm ci` no web/.
  - repo: local
    hooks:
      - id: prettier
        priority: formatar-depois
        name: prettier
        language: system
        entry: web/node_modules/.bin/prettier
        args: [--write, --ignore-path, web/.prettierignore]
        files: ^web/(src/.*\.(ts|svelte|css)|index\.html|[^/]+\.ts)$

  # Python do dwnvr-detect: lint e formatação, o flake8 e o black numa
  # ferramenta só. As regras estão no dwnvr-detect/ruff.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        priority: formatar
        args: [--fix]
      - id: ruff-format
        priority: formatar-depois
