# prek hooks (https://prek.j178.dev), which reads the pre-commit format. They
# run on every commit, on the commit's files, and fix what can be fixed. When a
# hook fixes something, the commit is interrupted: check it, `git add` and
# commit again.
#
# Once per machine: `uv tool install prek`. Once per clone: `prek install`.
# Run on everything, like CI: `prek run --all-files`
#
# CI runs this same file (.github/workflows/lint.yml) and fixes nothing: if a
# hook would change any file, the job fails and shows the diff.
#
# The file is prek-only: pre-commit rejects `default_language_version` in map
# form, and does not know `priority`, `priorities` or `minimum_prek_version`.

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

# The version CI installs. A prek older than it refuses to run.
minimum_prek_version: '0.5.3'

# The Go for the Go hooks (golangci-lint and betterleaks), which prek downloads
# and keeps in its own cache, not the Go on PATH. With asdf, the one on PATH is
# a shim that, in the hook's folder, falls back to the global Go, and every
# call to `go` gets slower. It is the go.mod Go: built with an older one,
# golangci-lint refuses to run. Change it here and prek rebuilds the
# environment by itself.
default_language_version:
  golang:
    request: '1.27.1'
    preference: only-managed

# The hook order. Hooks with the same `priority` run together, and the next
# value only starts when the previous one finishes. First the text fixers, 0 to
# 3, one at a time, because they touch the same files. Then the formatters,
# together, each on its own file type. Then whatever reads what they just
# wrote. Last, together, all the ones that only check. Every hook has its own,
# and a new hook goes into one of these waves.
priorities:
  format: 10
  format-after: 11
  check: 20

# What is generated, and therefore never edited by hand, stays out of every
# hook. internal/api/dist/ comes from `npm run build`, and ci.yml and the
# ui-up-to-date hook, below, compare it with a fresh build; CHANGELOG.md is
# written by the release. A hook that "fixed" them would break both.
exclude: ^(internal/api/dist/|CHANGELOG\.md$)

repos:
  # Hygiene for any text file. Binaries are left out on their own.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        priority: 0
      - id: end-of-file-fixer
        priority: 1
      - id: mixed-line-ending
        priority: 2
        args: [--fix=lf]
      - id: fix-byte-order-marker
        priority: 3
      - id: check-merge-conflict
        priority: check
      - id: check-case-conflict
        priority: check
      - id: check-yaml
        priority: check
      - id: check-json
        priority: check
        # JSONC: VS Code and TypeScript accept comments
        exclude: ^(\.vscode/|web/tsconfig[^/]*\.json$)
      - id: check-toml
        priority: check
      # A file above 500 KB interrupts the commit: a model, video or camera
      # frame sneaking in by accident. When it is on purpose:
      # SKIP=check-added-large-files git commit ... and the file goes into the
      # exclude. --enforce-all checks every file the hook receives, not only
      # the new one in staged: without it, in CI, which has no staged, the hook
      # checks nothing.
      - id: check-added-large-files
        priority: check
        args: [--enforce-all]
        exclude: ^dwnvr-detect/model/rfdetr-n_512x288_int8\.onnx$
      - id: detect-private-key
        priority: check

  # Markdown. The rules are in .markdownlint-cli2.yaml. --no-globs makes the
  # hook look only at the commit's files, not the config's `globs`, which is
  # the whole repository.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2
        priority: format
        args: [--no-globs, --fix]

  # Markdown links and anchors, without network. The rules are in lychee.toml.
  # It runs from the official image, so it needs Docker. The `lychee` hook
  # would avoid Docker, but it installs the binary by running in bash a script
  # downloaded from another repository's main branch, which may change at any
  # time. The `entry` pins the image tag, which the hook brings out of date.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee-docker
        priority: check
        entry: docker.io/lycheeverse/lychee:0.24.2-alpine
        types: [markdown]

  # YAML: workflows, compose and configs. The rules are in .yamllint.yaml, and
  # --strict makes a warning interrupt the commit too.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        priority: check
        args: [--strict]

  # Dockerfiles, with shellcheck on the RUNs. It runs from the official image,
  # so it needs Docker. The `entry` repeats the hook's to pin the tag: the
  # original uses the untagged image, which changes by itself.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        priority: check
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint

  # GitHub Actions workflows: syntax, expressions and shellcheck on the `run:`
  # steps. It runs from the official image, which already ships shellcheck and
  # comes with the tag pinned.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
        priority: check

  # Workflow security: action without a SHA, broad permission, exposed
  # credential. The rules are in .github/zizmor.yml. In the clone it runs
  # offline; CI hands it a token, which turns on the audits that query GitHub.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        priority: check

  # Secrets in the commit: tokens, keys and camera passwords in the rtsp://
  # URL. The rules are in .betterleaks.toml. The binary is built with the Go
  # from default_language_version, above.
  #
  # The first looks only at staged, and CI skips it (the SKIP in lint.yml). The
  # second, CI only, looks at the whole history: it catches what got in without
  # going through the hook (GitHub editor, a clone without `prek install`). By
  # hand:
  # prek run betterleaks-history --stage manual --all-files
  # --config is mandatory since 1.10: without it, betterleaks ignores
  # .betterleaks.toml and flags the example passwords that the filter there
  # allows.
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.10.1
    hooks:
      - id: betterleaks
        priority: check
        args: [--config, .betterleaks.toml]
      - id: betterleaks
        priority: check
        alias: betterleaks-history
        name: betterleaks on the history
        entry: betterleaks git --redact --verbose
        args: [--config, .betterleaks.toml]
        stages: [manual]

  # Go: bugs (errcheck, govet, staticcheck, unused...) and formatting (gofmt
  # and goimports). The rules are in .golangci.yml. -full looks at the whole
  # module: the plain hook only looks at what changed since HEAD, and in CI it
  # would find nothing. It is built with the Go from default_language_version,
  # above.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      - id: golangci-lint-full
        priority: check
      - id: golangci-lint-fmt
        priority: format
      - id: golangci-lint-config-verify
        priority: check

  # go.mod and go.sum in line with the imports: a missing dependency gets in,
  # a leftover one goes out.
  - repo: local
    hooks:
      - id: go-mod-tidy
        priority: format-after
        name: go mod tidy
        language: system
        entry: go mod tidy
        files: (\.go|^go\.mod|^go\.sum)$
        pass_filenames: false

  # TypeScript and Svelte: the types and the compiler warnings (accessibility,
  # unused CSS). svelte-check checks the screen through
  # web/tsconfig.app.json, and tsc checks the tool configs through
  # web/tsconfig.node.json: tsc alone does not read .svelte. It is web/'s
  # `npm run check`, in two hooks. They run on all of web/, because changing a
  # type breaks whoever uses it in another file, and they come from web/'s
  # devDependencies, like ESLint below: in a fresh clone, run `npm ci` in web/
  # first.
  - repo: local
    hooks:
      - id: svelte-check
        priority: check
        name: svelte-check
        language: system
        entry: web/node_modules/.bin/svelte-check --workspace web --tsconfig tsconfig.app.json --fail-on-warnings
        files: ^web/(src/|tsconfig[^/]*\.json$|package\.json$)
        pass_filenames: false
      - id: tsc-configs
        priority: check
        name: tsc of the web/ configs
        language: system
        entry: web/node_modules/.bin/tsc -p web/tsconfig.node.json
        files: ^web/([^/]+\.ts|tsconfig[^/]*\.json|package\.json)$
        pass_filenames: false

  # Does the commit's internal/api/dist/ match the commit's web/? It is the
  # "is the UI up to date?" step of ci.yml, here before the push: a screen
  # commit without the rebuilt output ships a binary that serves the old
  # screen. The build goes to a temporary folder, and the result is compared
  # with staged, without touching the clone's dist: the hook only rejects. New
  # files count, because every build changes the hashed names. Vite runs from
  # inside web/, as in `npm run build`: run from the root, the hashes come out
  # different. It comes from web/node_modules, so the build only matches CI's
  # if node_modules agrees with package-lock.json: when in doubt, `npm ci` in
  # web/.
  - repo: local
    hooks:
      - id: ui-up-to-date
        priority: check
        name: is the UI up to date?
        language: system
        entry: |
          bash -c '
            set -eu
            tmp=$(mktemp -d)
            trap "rm -rf $tmp" EXIT
            (cd web && node_modules/.bin/vite build --outDir "$tmp/internal/api/dist" --emptyOutDir --logLevel warn)
            cp "${GIT_INDEX_FILE:-$(git rev-parse --git-path index)}" "$tmp/index"
            # Only the second column, the build against staged. The first is
            # staged against HEAD, which does change in a screen commit.
            differs=$(GIT_INDEX_FILE="$tmp/index" git --work-tree="$tmp" status --porcelain --no-renames --untracked-files=all -- internal/api/dist | grep -v "^. " || true)
            if [ -n "$differs" ]; then
              echo "internal/api/dist does not match web/ in the commit. Rebuild and add the result:"
              echo "  (cd web && npm run build) && git add internal/api/dist"
              echo
              echo "How the staged dist looks after the build (D goes out, ?? comes in, M changes):"
              echo "$differs"
              exit 1
            fi
          '
        files: ^web/(src/|public/|index\.html$|package(-lock)?\.json$|vite\.config\.ts$)
        pass_filenames: false

  # The contrast of every text and background pair in every theme palette
  # (WCAG AA), read from web/src/app.css. Plain Node, with no dependency: a
  # palette that fails does not get in. The pairs are listed in the script.
  - repo: local
    hooks:
      - id: contrast
        priority: check
        name: theme contrast
        language: system
        entry: node web/scripts/contrast.mjs
        files: ^web/(src/app\.css|index\.html|scripts/contrast\.mjs)$
        pass_filenames: false

  # TypeScript and Svelte: bugs and bad practice, with the rules that read the
  # types. The rules are in web/eslint.config.ts, and ESLint comes from web/'s
  # devDependencies: in a fresh clone, run `npm ci` in web/ first.
  # --no-warn-ignored silences the warning about src/vendor/, which the config
  # leaves out. --max-warnings=0 makes a warning interrupt the commit: in
  # recommended, a forgotten `$inspect` or `{@debug}` is only a warning.
  - repo: local
    hooks:
      - id: eslint
        priority: format
        name: eslint
        language: system
        entry: web/node_modules/.bin/eslint
        args: [--fix, --no-warn-ignored, --max-warnings=0]
        files: ^web/(src/.*\.(ts|svelte)|[^/]+\.ts)$

  # TypeScript, Svelte, CSS, web/'s index.html and web/scripts: formatting. The rules are in
  # web/prettier.config.ts. It comes after ESLint, because its --fix may leave
  # a line out of format, so Prettier has the last word. --ignore-path points
  # at web/'s .prettierignore, which Prettier only looks for in the folder it
  # is called from, and here that is the root. Prettier comes from web/'s
  # devDependencies: in a fresh clone, run `npm ci` in web/ first.
  - repo: local
    hooks:
      - id: prettier
        priority: format-after
        name: prettier
        language: system
        entry: web/node_modules/.bin/prettier
        args: [--write, --ignore-path, web/.prettierignore]
        files: ^web/(src/.*\.(ts|svelte|css)|scripts/.*\.mjs|index\.html|[^/]+\.ts)$

  # dwnvr-detect Python: lint and formatting, flake8 and black in a single
  # tool. The rules are in dwnvr-detect/ruff.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        priority: format
        args: [--fix]
      - id: ruff-format
        priority: format-after
