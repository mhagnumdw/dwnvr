# Hooks do prek (https://prek.j178.dev), que lê o formato do pre-commit. Rodam
# a cada commit, nos arquivos do commit, e corrigem o que dá para corrigir.
# Quando um hook corrige algo, o commit é interrompido: confira, dê `git add` e
# commite de novo.
#
# Uma vez por máquina: `uv tool install prek`. Uma vez por clone:
# `prek install`. Rodar em tudo, como a CI: `prek run --all-files`
#
# A CI roda este mesmo arquivo (.github/workflows/lint.yml) e não corrige
# nada: se um hook mudaria algum arquivo, o job falha e mostra o diff.
#
# O arquivo é só do prek: o pre-commit recusa o `default_language_version` em
# forma de mapa, e não conhece o `priority`, o `priorities` e o
# `minimum_prek_version`.

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

# A versão que a CI instala. Um prek mais velho que ela se recusa a rodar.
minimum_prek_version: '0.5.3'

# O Go dos hooks em Go (golangci-lint e betterleaks), que o prek baixa e guarda
# no cache dele, e não o Go do PATH. Com o asdf, o do PATH é um shim que, na
# pasta do hook, cai no Go global, e cada chamada ao `go` fica mais lenta. É o
# Go do go.mod: compilado com um mais velho, o golangci-lint se recusa a rodar.
# Mudou aqui, o prek monta o ambiente de novo sozinho.
default_language_version:
  golang:
    request: '1.27.1'
    preference: only-managed

# A ordem dos hooks. Os de mesmo `priority` rodam juntos, e o valor seguinte
# só começa quando o anterior termina. Primeiro os fixers de texto, de 0 a 3,
# um por vez, porque mexem nos mesmos arquivos. Depois os formatadores, juntos,
# cada um no seu tipo de arquivo. Depois o que lê o que eles acabaram de
# escrever. Por fim, juntos, todos os que só conferem. Todo hook tem o seu, e
# hook novo entra numa dessas ondas.
priorities:
  formatar: 10
  formatar-depois: 11
  conferir: 20

# O que é gerado, e por isso nunca editado à mão, fica fora de todo hook. O
# internal/api/dist/ sai do `npm run build`, e o ci.yml o compara com um build
# novo; o CHANGELOG.md é escrito pela release. Um hook que os "consertasse"
# quebraria as duas coisas.
exclude: ^(internal/api/dist/|CHANGELOG\.md$)

repos:
  # Higiene de qualquer arquivo texto. Binário fica de fora sozinho.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        priority: 0
      - id: end-of-file-fixer
        priority: 1
      - id: mixed-line-ending
        priority: 2
        args: [--fix=lf]
      - id: fix-byte-order-marker
        priority: 3
      - id: check-merge-conflict
        priority: conferir
      - id: check-case-conflict
        priority: conferir
      - id: check-yaml
        priority: conferir
      - id: check-json
        priority: conferir
        exclude: ^\.vscode/  # JSONC: o VS Code aceita comentário
      - id: check-toml
        priority: conferir
      # Arquivo acima de 500 KB interrompe o commit: modelo, vídeo ou quadro
      # de câmera entrando sem querer. Quando for de propósito:
      # SKIP=check-added-large-files git commit ... e o arquivo entra no
      # exclude. O --enforce-all confere todo arquivo que o hook recebe, e não
      # só o novo no staged: sem ele, na CI, que não tem staged, o hook não
      # confere nada.
      - id: check-added-large-files
        priority: conferir
        args: [--enforce-all]
        exclude: ^dwnvr-detect/modelo/rfdetr-n_512x288_int8\.onnx$
      - id: detect-private-key
        priority: conferir

  # Markdown. As regras estão no .markdownlint-cli2.yaml. O --no-globs faz o
  # hook olhar só os arquivos do commit, e não o `globs` da config, que é o
  # repositório inteiro.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        priority: formatar
        args: [--no-globs, --fix]

  # Link e âncora do Markdown, sem rede. As regras estão no lychee.toml. Roda
  # pela imagem oficial, então precisa de Docker. O hook `lychee` evitaria o
  # Docker, mas instala o binário rodando no bash um script baixado do branch
  # main de outro repositório, que pode mudar a qualquer hora. O `entry` fixa
  # a tag da imagem, que o hook traz atrasada.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee-docker
        priority: conferir
        entry: docker.io/lycheeverse/lychee:0.24.2-alpine
        types: [markdown]

  # YAML: workflows, compose e configs. As regras estão no .yamllint.yaml, e o
  # --strict faz aviso também interromper o commit.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        priority: conferir
        args: [--strict]

  # Dockerfiles, com o shellcheck nos RUN. Roda pela imagem oficial, então
  # precisa de Docker. O `entry` repete o do hook para fixar a tag: o original
  # usa a imagem sem tag, que muda sozinha.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        priority: conferir
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint

  # Workflows do GitHub Actions: sintaxe, expressões e o shellcheck nos `run:`.
  # Roda pela imagem oficial, que já traz o shellcheck e vem com a tag fixada.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
        priority: conferir

  # Segurança dos workflows: action sem SHA, permissão ampla, credencial
  # exposta. As regras estão no .github/zizmor.yml. No clone roda offline; a
  # CI lhe passa um token, que liga os audits que consultam o GitHub.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        priority: conferir

  # Segredo no commit: token, chave e senha de câmera na URL rtsp://. As
  # regras estão no .betterleaks.toml. O binário é compilado com o Go do
  # default_language_version, acima.
  #
  # O primeiro olha só o staged, e a CI o pula (o SKIP do lint.yml). O
  # segundo, só na CI, olha o histórico inteiro: pega o que entrou sem passar
  # pelo hook (editor do GitHub, clone sem `prek install`). À mão:
  # prek run betterleaks-historico --stage manual --all-files
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.8.1
    hooks:
      - id: betterleaks
        priority: conferir
      - id: betterleaks
        priority: conferir
        alias: betterleaks-historico
        name: betterleaks no histórico
        entry: betterleaks git --redact --verbose
        stages: [manual]

  # Go: bug (errcheck, govet, staticcheck, unused...) e formatação (gofmt e
  # goimports). As regras estão no .golangci.yml. O -full olha o módulo
  # inteiro: o hook comum só olha o que mudou desde o HEAD, e na CI não acharia
  # nada. Ele é compilado com o Go do default_language_version, acima.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint-full
        priority: conferir
      - id: golangci-lint-fmt
        priority: formatar
      - id: golangci-lint-config-verify
        priority: conferir

  # go.mod e go.sum de acordo com os imports: dependência que falta entra, a
  # que sobra sai.
  - repo: local
    hooks:
      - id: go-mod-tidy
        priority: formatar-depois
        name: go mod tidy
        language: system
        entry: go mod tidy
        files: (\.go|^go\.mod|^go\.sum)$
        pass_filenames: false

  # Svelte: os warnings do compilador (acessibilidade, CSS sem uso). Tipo do
  # JavaScript ele não confere: o web/ não tem jsconfig.json com checkJs. Roda
  # no web/ inteiro, e o svelte-check vem das devDependencies do web/, como o
  # ESLint abaixo: em clone novo, antes rode `npm ci` no web/.
  - repo: local
    hooks:
      - id: svelte-check
        priority: conferir
        name: svelte-check
        language: system
        entry: web/node_modules/.bin/svelte-check --workspace web --fail-on-warnings
        files: ^web/(src/|svelte\.config\.js$|vite\.config\.js$)
        pass_filenames: false

  # JavaScript e Svelte: bug e má prática. As regras estão no
  # web/eslint.config.js, e o ESLint vem das devDependencies do web/: em clone
  # novo, antes rode `npm ci` no web/. O --no-warn-ignored cala o aviso sobre o
  # src/vendor/, que a config deixa de fora. O --max-warnings=0 faz warning
  # interromper o commit: no recommended, o `$inspect` e o `{@debug}`
  # esquecidos são só warning.
  - repo: local
    hooks:
      - id: eslint
        priority: formatar
        name: eslint
        language: system
        entry: web/node_modules/.bin/eslint
        args: [--fix, --no-warn-ignored, --max-warnings=0]
        files: ^web/(src/.*\.(js|svelte)|[^/]+\.js)$

  # Os testes ponta a ponta (e2e/): os tipos do TypeScript, e o ESLint com o
  # plugin do Playwright, que cobra as regras do docs/plano-testes-e2e.md
  # (nada de espera fixa, nada de teste pulado). As regras estão no
  # e2e/eslint.config.mjs. Os dois vêm das devDependencies do e2e/: em clone
  # novo, antes rode `npm ci` no e2e/, como no web/.
  - repo: local
    hooks:
      - id: eslint-e2e
        priority: formatar
        name: eslint (e2e)
        language: system
        entry: e2e/node_modules/.bin/eslint
        args: [--fix, --no-warn-ignored, --max-warnings=0]
        files: ^e2e/((testes|apoio)/.*\.ts|[^/]+\.(ts|mjs))$
      - id: tsc-e2e
        priority: conferir
        name: tsc (e2e)
        language: system
        entry: e2e/node_modules/.bin/tsc -p e2e
        files: ^e2e/((testes|apoio)/.*\.ts|[^/]+\.ts|tsconfig\.json)$
        pass_filenames: false

  # Python do dwnvr-detect: lint e formatação, o flake8 e o black numa
  # ferramenta só. As regras estão no dwnvr-detect/ruff.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        priority: formatar
        args: [--fix]
      - id: ruff-format
        priority: formatar-depois
