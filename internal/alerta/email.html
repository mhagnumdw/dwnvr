<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{.Assunto}}</title>
</head>
{{- /* O layout do e-mail de alerta (ver corpoDoAlerta em email.go). Tabela e
   estilo inline, que é o que Gmail e Outlook respeitam; nada de <style> nem
   de arquivo de fora. O quadro vem dentro da mensagem, pelo cid:. */}}
<body style="margin:0;padding:0;background:#f6f8fa">
<div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;mso-hide:all">{{.Previa}}{{range .Enchimento}}&#847;&zwnj;&nbsp;{{end}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f6f8fa">
<tr><td style="padding:16px 12px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;margin:0 auto;background:#ffffff;border:1px solid #d0d7de;border-radius:10px;border-collapse:separate;overflow:hidden">
<tr><td style="padding:12px 16px;border-bottom:1px solid #d0d7de">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
<td><img src="cid:{{.Marca}}" width="22" height="22" alt="" style="display:inline-block;vertical-align:middle;border:0;border-radius:5px"><span style="display:inline-block;vertical-align:middle;margin-left:8px;font-weight:700;letter-spacing:.3px;font-size:15px;color:#1f2328">dwnvr</span></td>
<td align="right" style="color:#59636e;font-size:13px">Alerta · {{.Camera}}</td>
</tr></table>
</td></tr>
{{- if .Imagem}}
<tr><td style="padding:0"><img src="cid:{{.Imagem}}" alt="{{.AltDaImagem}}" width="600" style="display:block;width:100%;max-width:600px;height:auto;border:0"></td></tr>
{{- end}}
<tr><td style="padding:16px 18px 6px">
<div style="font-size:20px;font-weight:700;line-height:1.25">{{.Titulo}}</div>
<div style="color:#59636e;font-size:14px;line-height:1.4;margin-top:2px">{{.Linha}}</div>
</td></tr>
<tr><td style="padding:8px 18px">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-size:14px;line-height:1.4">
{{- range .Objetos}}
<tr>
<td style="padding:3px 8px 3px 0;vertical-align:middle"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:{{.Cor}}"></span></td>
<td style="padding:3px 10px 3px 0;font-weight:600;white-space:nowrap">{{.Nome}}</td>
<td style="padding:3px 10px 3px 0;color:#59636e">{{.Score}}</td>
<td style="padding:3px 0;color:#59636e">{{.Onde}}</td>
</tr>
{{- end}}
</table>
</td></tr>
<tr><td style="padding:12px 18px 18px">
{{- if .Link}}
<a href="{{.Link}}" style="display:block;text-align:center;background:#2f81f7;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px;border-radius:8px">&#9654; Ver na gravação</a>
{{- else}}
<p style="margin:0;font-size:13px;line-height:1.5;color:#59636e;font-style:italic">Veja mais detalhes na tela de Gravações. Para aparecer aqui um botão que leva direto a este momento, peça ao administrador que defina <code style="font-style:normal;background:#eff2f5;padding:1px 4px;border-radius:4px">server.publicUrl</code>.</p>
{{- end}}
</td></tr>
</table>
<div style="max-width:600px;margin:10px auto 0;text-align:center;color:#59636e;font-size:12px">{{.Rodape}}</div>
</td></tr>
</table>
</body>
</html>
