# For developers: runs dwnvr built from this clone instead of the published
# image. If you only want to use dwnvr, you do not need this file.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# The tag is local on purpose, without ghcr.io - the same rule as the image
# targets in the Makefile: a careless `docker push` does not publish to the
# registry an image that never went through CI, and a published image that is
# already pulled does not get overwritten.
#
# dwnvr-detect only starts with the `detect` profile (see docker-compose.yml).

services:
  dwnvr:
    image: dwnvr:dev
    build: .

  dwnvr-detect:
    image: dwnvr-detect:dev
    build: ./dwnvr-detect
