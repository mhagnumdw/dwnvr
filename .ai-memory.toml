# Roteamento do ai-memory para este repositório.
# Doc oficial: https://github.com/akitaonrails/ai-memory/blob/main/docs/marker-file.md
#
# Sem `project` declarado, o nome do projeto vem do caminho do remote
# `upstream` (ou `origin`); só repos sem remote caem no basename do diretório.
# Declarar `project` fixa o nome, independente de remote ou pasta, e faz todos
# os worktrees deste repo convergirem para o mesmo project.
#
# project_strategy = "repo-root" só tem efeito quando o nome não vem de
# `project` nem de remote; fica como salvaguarda.
workspace = "default"
project = "dwnvr"
project_strategy = "repo-root"
