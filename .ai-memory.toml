# Roteamento do ai-memory para este repositório.
# Doc oficial: https://github.com/akitaonrails/ai-memory/blob/main/docs/marker-file.md
#
# Sem este arquivo o projeto é resolvido pelo BASENAME do diretório, o que
# significa que mover ou renomear a pasta pode fatiar a memória em dois
# projetos distintos.
#
# project_strategy = "repo-root" faz todos os worktrees deste repo convergirem
# para o mesmo project, em vez de cada worktree virar um project separado.
workspace = "default"
project = "dwnvr"
project_strategy = "repo-root"
