# ai-memory routing for this repository.
# Official doc: https://github.com/akitaonrails/ai-memory/blob/main/docs/marker-file.md
#
# Without a declared `project`, the project name comes from the path of the
# `upstream` (or `origin`) remote; only repos without a remote fall back to the
# directory basename. Declaring `project` pins the name regardless of remote or
# folder, and makes every worktree of this repo converge on the same project.
#
# project_strategy = "repo-root" only takes effect when the name comes from
# neither `project` nor a remote; it stays as a safeguard.
workspace = "default"
project = "dwnvr"
project_strategy = "repo-root"
