# Instalação do dwnvr, com o go2rtc junto para você subir tudo de uma vez.
#
# É o mesmo arquivo para experimentar e para instalar de verdade, e você não
# precisa editá-lo: tudo que muda de uma instalação para outra - os caminhos
# no disco, o UID, o fuso - vem do .env ao lado dele. Sem .env, ele sobe com os
# valores do teste rápido: lê de ./config e grava em ./storage.
#
# As imagens vêm prontas do ghcr.io, publicadas pela CI; nada é compilado na
# sua máquina. Para subir a partir do código, veja docker-compose.build.yml.
#
# O go2rtc está aqui por conveniência, mas continua fora do escopo do dwnvr: o
# conteúdo do go2rtc.yaml - câmeras, URLs RTSP, codecs - é responsabilidade de
# quem instala. Se você já tem um go2rtc rodando em outro lugar, apague o
# serviço lá embaixo e veja a nota em extra_hosts.

services:
  dwnvr:
    image: ghcr.io/mhagnumdw/dwnvr:latest
    container_name: dwnvr
    restart: unless-stopped
    depends_on: [go2rtc]

    # O container grava com este UID. Deixar como root faria os arquivos
    # nascerem de root no disco - que é justamente o que impede você de
    # inspecioná-los ou apagá-los depois sem sudo.
    #
    # 1000 é o primeiro usuário na maioria das máquinas Linux, e por isso é o
    # padrão. Se o seu for outro (descubra com: id -u; id -g), crie um .env ao
    # lado deste arquivo com DWNVR_UID e DWNVR_GID - sem isso o dwnvr sobe, mas
    # a tela de cadastro falha ao gravar o cameras.json.
    user: "${DWNVR_UID:-1000}:${DWNVR_GID:-1000}"

    ports:
      - "8080:8080"

    environment:
      # Sem isto todos os dias são calculados em UTC, e a virada de dia da
      # timeline cai no horário errado. Defina TZ no .env.
      - TZ=${TZ:-America/Fortaleza}

    # Crie os dois diretórios antes de subir. Se o Docker precisar criá-los,
    # eles nascem de root, e aí o container - que roda com o UID acima - não
    # consegue escrever dentro deles.
    #
    # O `:z` no fim de cada volume é para quem tem SELinux ligado (Fedora, RHEL)
    # e sobe com Podman: ele troca o label do diretório para um que o container
    # pode ler. Sem isso, até o dwnvr.yaml dá `permission denied`. Onde não há
    # SELinux, ou no Docker, que por padrão não o aplica, ele não faz nada.
    volumes:
      # Só o lado esquerdo muda, e pelo .env: DWNVR_CONFIG_DIR e
      # DWNVR_STORAGE_DIR apontam para o disco onde as gravações cabem. O lado
      # direito é o que o container enxerga por dentro, e /storage é o que o
      # dwnvr.yaml chama de `storage.root`.

      # dwnvr.yaml, cameras.json e o segredo de sessão.
      - ${DWNVR_CONFIG_DIR:-./config/dwnvr}:/etc/dwnvr:z

      # As gravações das câmeras. O default é para você experimentar sem
      # preparar disco nenhum.
      - ${DWNVR_STORAGE_DIR:-./storage}:/storage:z

    # Com o go2rtc neste mesmo compose, o dwnvr o alcança pelo nome do serviço:
    # basta que o dwnvr.yaml tenha go2rtc.url: http://go2rtc:1984
    #
    # Se o go2rtc estiver fora daqui - outro compose, ou direto no host -,
    # apague o serviço abaixo, descomente estas linhas e aponte a url para
    # http://host.docker.internal:1984
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    # Teto de memória como rede de segurança. O consumo medido com 9 câmeras é
    # de ~20 MB; 128M é folga larga e ainda protege o resto do sistema.
    deploy:
      resources:
        limits:
          memory: 128M

  # Fonte dos streams. O dwnvr só consome o que este serviço já produz.
  go2rtc:
    image: alexxit/go2rtc
    container_name: go2rtc
    restart: unless-stopped
    shm_size: 128mb

    # As suas câmeras moram no go2rtc.yaml desta pasta. Ele é seu; o dwnvr
    # não o escreve.
    #
    # A pasta vem de GO2RTC_CONFIG_DIR no .env. Ela é irmã da do dwnvr, e não
    # a mesma, de propósito: cada container enxerga só a própria configuração.
    # As URLs RTSP, com usuário e senha, ficam aqui; o segredo de sessão e a
    # senha de login do dwnvr ficam lá.
    volumes:
      - ${GO2RTC_CONFIG_DIR:-./config/go2rtc}:/config:z

    ports:
      - "1984:1984"      # API e interface web do go2rtc
      - "8554:8554"      # servidor RTSP
      - "8555:8555/tcp"  # WebRTC, usado pelo player ao vivo
      - "8555:8555/udp"

  # O detector de objetos, opcional: diz se o movimento marcado era pessoa,
  # veículo ou animal. Ver dwnvr-detect/README.md.
  #
  # Ele só sobe com o profile `detect`, e quem só grava não baixa nem a imagem.
  # Para ligar, ponha COMPOSE_PROFILES=detect no .env, e no dwnvr.yaml:
  #   detector:
  #     url: http://dwnvr-detect:8480
  dwnvr-detect:
    profiles: [detect]
    image: ghcr.io/mhagnumdw/dwnvr-detect:latest
    container_name: dwnvr-detect
    restart: unless-stopped

    # Sem porta publicada: só o dwnvr fala com ele, pela rede do compose.

    environment:
      # Com 2 threads, uma olhada cai de ~6,5 s para ~3,6 s num Orange Pi
      # Zero 3, por ~10% a mais de CPU no total. Com 1, baixe o `cpus` para 1.
      - DETECT_THREADS=2

    # O teto de CPU é o que impede o detector de tomar a máquina de quem grava.
    # O de memória cobre o pico de uma olhada (~250 MB) com folga.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 400M
