# dwnvr installation, with go2rtc alongside so you can bring everything up at
# once.
#
# It is the same file for trying it out and for a real installation, and you
# do not need to edit it: everything that changes from one installation to
# another - the disk paths, the UID, the time zone - comes from the .env next
# to it. Without a .env, it comes up with the quick-test values: reads from
# ./config and writes to ./storage.
#
# The images come ready from ghcr.io, published by CI; nothing is built on your
# machine. To bring it up from the source code, see docker-compose.build.yml.
#
# go2rtc is here for convenience, but it stays out of dwnvr's scope: the
# contents of go2rtc.yaml - cameras, RTSP URLs, codecs - are the
# installer's responsibility. If you already have a go2rtc running somewhere
# else, delete the service below and see the note on extra_hosts.

services:
  dwnvr:
    # The image tag comes from DWNVR_VERSION in the .env: `main` follows every
    # commit on main. Without it, what comes after the `:-` applies, which each
    # release rewrites with its own version - release.yml looks for this line
    # and the dwnvr-detect one in this exact format.
    image: ghcr.io/mhagnumdw/dwnvr:${DWNVR_VERSION:-v0.16.0}
    container_name: dwnvr
    restart: unless-stopped
    depends_on: [go2rtc]

    # The container writes with this UID. Leaving it as root would make files
    # be born as root on disk - which is exactly what stops you from
    # inspecting or deleting them later without sudo.
    #
    # 1000 is the first user on most Linux machines, and that is why it is the
    # default. If yours is different (find out with: id -u; id -g), create a
    # .env next to this file with DWNVR_UID and DWNVR_GID - without it dwnvr
    # starts, but the camera form fails to write cameras.json.
    user: "${DWNVR_UID:-1000}:${DWNVR_GID:-1000}"

    ports:
      - "8080:8080"

    environment:
      # Without this every day is computed in UTC, and the timeline's day
      # rollover lands at the wrong time. Set TZ in the .env.
      - TZ=${TZ:-America/Fortaleza}

    # Create both directories before starting. If Docker has to create them,
    # they are born as root, and then the container - which runs with the UID
    # above - cannot write inside them.
    #
    # The `:z` at the end of each volume is for those with SELinux on (Fedora,
    # RHEL) who run Podman: it relabels the directory to one the container can
    # read. Without it, even dwnvr.yaml gives `permission denied`. Where there
    # is no SELinux, or on Docker, which does not apply it by default, it does
    # nothing.
    volumes:
      # Only the left side changes, and through the .env: DWNVR_CONFIG_DIR and
      # DWNVR_STORAGE_DIR point to the disk where the recordings fit. The right
      # side is what the container sees inside, and /storage is what
      # dwnvr.yaml calls `storage.root`.

      # dwnvr.yaml, cameras.json and the session secret.
      - ${DWNVR_CONFIG_DIR:-./config/dwnvr}:/etc/dwnvr:z

      # The camera recordings. The default is for you to try it out without
      # preparing any disk.
      - ${DWNVR_STORAGE_DIR:-./storage}:/storage:z

    # With go2rtc in this same compose, dwnvr reaches it by the service name:
    # dwnvr.yaml only needs go2rtc.url: http://go2rtc:1984
    #
    # If go2rtc is outside here - another compose, or straight on the host -,
    # delete the service below, uncomment these lines and point the url to
    # http://host.docker.internal:1984
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    # Memory ceiling as a safety net. The consumption measured with 9 cameras
    # is ~20 MB; 128M is ample headroom and still protects the rest of the
    # system.
    deploy:
      resources:
        limits:
          memory: 128M

  # Source of the streams. dwnvr only consumes what this service already
  # produces.
  go2rtc:
    # Pinned version, the one tested with this version of dwnvr: with no tag,
    # the update's --pull always would bring the newest go2rtc, which nobody
    # tested with it. For another one, set GO2RTC_VERSION in the .env.
    image: alexxit/go2rtc:${GO2RTC_VERSION:-1.9.14}
    container_name: go2rtc
    restart: unless-stopped
    shm_size: 128mb

    # Your cameras live in the go2rtc.yaml of this folder. It is yours; dwnvr
    # does not write it.
    #
    # The folder comes from GO2RTC_CONFIG_DIR in the .env. It is a sibling of
    # dwnvr's, not the same one, on purpose: each container sees only its own
    # configuration. The RTSP URLs, with user and password, stay here; dwnvr's
    # session secret and login password stay there.
    volumes:
      - ${GO2RTC_CONFIG_DIR:-./config/go2rtc}:/config:z

    # The API and RTSP open only on the server itself: dwnvr talks to go2rtc
    # over the compose network, and neither asks for a password by default. To
    # open them to the network, set a password in go2rtc.yaml and
    # GO2RTC_API_PORT=1984 or GO2RTC_RTSP_PORT=8554 in the .env - see "Opening
    # go2rtc to the network" in the README.
    ports:
      - "${GO2RTC_API_PORT:-127.0.0.1:1984}:1984"   # go2rtc API and web interface
      - "${GO2RTC_RTSP_PORT:-127.0.0.1:8554}:8554"  # RTSP server
      - "8555:8555/tcp"  # WebRTC, used by the live player
      - "8555:8555/udp"

  # The object detector, optional: tells whether the marked motion was a
  # person, a vehicle or an animal. See dwnvr-detect/README.md.
  #
  # It only starts with the `detect` profile, and whoever only records does not
  # even download the image. To turn it on, set COMPOSE_PROFILES=detect in the
  # .env, and in dwnvr.yaml:
  #   detector:
  #     url: http://dwnvr-detect:8480
  dwnvr-detect:
    profiles: [detect]
    # The same DWNVR_VERSION as dwnvr: both images ship together, with the
    # same tags.
    image: ghcr.io/mhagnumdw/dwnvr-detect:${DWNVR_VERSION:-v0.16.0}
    container_name: dwnvr-detect
    restart: unless-stopped

    # No published port: only dwnvr talks to it, over the compose network.

    environment:
      # Without DETECT_THREADS in the .env, the object detector uses half of
      # the machine's cores, up to 4 threads. For another number, set it in the
      # .env, for example DETECT_THREADS=2.
      - DETECT_THREADS=${DETECT_THREADS:-auto}

    # The memory ceiling covers the peak of a look (~250 MB) with room to
    # spare.
    deploy:
      resources:
        limits:
          memory: 400M
