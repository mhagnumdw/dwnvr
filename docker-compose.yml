# Instalação do dwnvr, com o go2rtc junto para você subir tudo de uma vez.
#
# É o mesmo arquivo para experimentar e para instalar de verdade: como vem, ele
# constrói a imagem deste clone e grava as câmeras em ./storage, então basta ter
# Docker - nem câmera, nem Go, nem Node. As duas linhas a trocar quando isto
# virar a sua instalação definitiva estão marcadas abaixo.
#
# O go2rtc está aqui por conveniência, mas continua fora do escopo do dwnvr: o
# conteúdo do go2rtc.yaml - câmeras, URLs RTSP, codecs - é responsabilidade de
# quem instala. Se você já tem um go2rtc rodando em outro lugar, apague o
# serviço lá embaixo e veja a nota em extra_hosts.

services:
  dwnvr:
    # Constrói a imagem a partir deste clone. É o que dispensa Go e Node na sua
    # máquina - o Dockerfile compila a interface e o binário lá dentro.
    build: .
    # (1) Trocar por: `image: ghcr.io/mhagnumdw/dwnvr:latest`
    #     para baixar a imagem pronta em vez de construir, mas ela ainda não
    #     não está pública.

    container_name: dwnvr
    restart: unless-stopped
    depends_on: [go2rtc]

    # O container grava com este UID. Deixar como root faria os arquivos
    # nascerem de root no disco - que é justamente o que impede você de
    # inspecioná-los ou apagá-los depois sem sudo.
    #
    # 1000 é o primeiro usuário na maioria das máquinas Linux, e por isso é o
    # padrão. Se o seu for outro (descubra com: id -u; id -g), crie um .env ao
    # lado deste arquivo com DWNVR_UID e DWNVR_GID - sem isso o dwnvr sobe, mas
    # a tela de cadastro falha ao gravar o cameras.json.
    user: "${DWNVR_UID:-1000}:${DWNVR_GID:-1000}"

    ports:
      - "8080:8080"

    environment:
      # Sem isto todos os dias são calculados em UTC, e a virada de dia da
      # timeline cai no horário errado. Troque aqui, ou defina TZ no .env.
      - TZ=${TZ:-America/Fortaleza}

    # Crie os dois diretórios antes de subir: `mkdir -p config storage`. Se o
    # Docker precisar criá-los, eles nascem de root, e aí o container - que
    # roda com o UID acima - não consegue escrever dentro deles.
    volumes:
      # dwnvr.yaml, cameras.json e o segredo de sessão.
      - ./config:/etc/dwnvr

      # As gravações das câmeras. Ao lado do clone para você experimentar sem
      # preparar disco nenhum.
      - ./storage:/storage
      # (2) Trocar pelo local definitivo no host, ex: /mnt/storage/dwnvr:/storage
      #     na instalação de verdade. O lado direito é o que o dwnvr.yaml chama de
      #     storage.root, e ele não muda.

    # Com o go2rtc neste mesmo compose, o dwnvr o alcança pelo nome do serviço:
    # basta que o dwnvr.yaml tenha go2rtc.url: http://go2rtc:1984
    #
    # Se o go2rtc estiver fora daqui - outro compose, ou direto no host -,
    # apague o serviço abaixo, descomente estas linhas e aponte a url para
    # http://host.docker.internal:1984
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    # Teto de memória como rede de segurança. O consumo medido com 9 câmeras é
    # de ~20 MB; 128M é folga larga e ainda protege o resto do sistema.
    deploy:
      resources:
        limits:
          memory: 128M

  # Fonte dos streams. O dwnvr só consome o que este serviço já produz.
  go2rtc:
    image: alexxit/go2rtc
    container_name: go2rtc
    restart: unless-stopped
    shm_size: 128mb

    # As suas câmeras moram aqui. Este arquivo é seu; o dwnvr não o escreve.
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml

    ports:
      - "1984:1984"      # API e interface web do go2rtc
      - "8554:8554"      # servidor RTSP
      - "8555:8555/tcp"  # WebRTC, usado pelo player ao vivo
      - "8555:8555/udp"
