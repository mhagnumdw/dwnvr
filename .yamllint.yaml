# yamllint rules, read by the prek hook (and by it in CI).

extends: default

rules:
  # No `---` at the start: no YAML here has more than one document.
  document-start: disable
  # No line limit: Actions expressions, sed regexes and ffmpeg commands have
  # nowhere to break.
  line-length: disable
  # The `on:` of GitHub Actions is a key, not a boolean.
  truthy:
    check-keys: false
