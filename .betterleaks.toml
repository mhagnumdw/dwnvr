# betterleaks rules (https://github.com/betterleaks/betterleaks): secrets in
# the commit. The hook is in .pre-commit-config.yaml and looks only at what is
# staged.
#
# The default rules cover provider tokens and keys. The one below covers the
# most likely leak here: the camera password inside the rtsp:// URL.
#
# One-off false positive: a `betterleaks:allow` comment at the end of the line.

title = "dwnvr"

# The repository's example passwords, which are not secrets: "senha" in the
# rtsp:// URLs of go2rtc.example.yaml and in the tests, "troque-me" in
# dwnvr.example.yaml. The rest only in the tests. "admin" because
# `Username, Password = "admin", "senha"` confuses the generic rule: outside
# them, user admin with password admin is the factory default of many cameras,
# and has to be blocked. The others are the ones for the invite and the
# password change, in the `{"password": ...}` body, which must differ from one
# another and have different lengths ("curta" exists to be rejected).
filter = '''
finding["secret"] in ["senha", "troque-me"] ||
(attributes["path"] endsWith "_test.go" &&
  finding["secret"] in ["admin", "curta", "senha errada", "uma senha boa", "outra senha boa"])
'''

[extend]
useDefault = true

[[rules]]
id = "rtsp-url-com-senha"
description = "rtsp:// URL with user and password"
keywords = ["rtsp"]
regex = '''(?i)rtsps?://[^\s:/@'"]+:([^\s@'"]+)@'''
