# go2rtc configuration - the source of the streams dwnvr records.
#
# This file is YOURS. dwnvr never writes it: it only reads the stream list
# through the go2rtc API and records what you have published here.
#
# Copy it to config/go2rtc/go2rtc.yaml: docker-compose.yml mounts the
# config/go2rtc/ folder at /config, and go2rtc reads /config/go2rtc.yaml.
# go2rtc.yaml is ignored by git, which is why RTSP URLs with user and password
# cannot end up in a commit.

streams:
  # The name of each stream here is the camera ID in dwnvr: everything
  # published in this section shows up by itself on the "Câmeras" screen, ready
  # to be registered. dwnvr stores no camera URL or password - only this name.

  # Synthetic sources, to try dwnvr without any camera.
  # ffmpeg draws the frame and go2rtc delivers it as H264 - from dwnvr's point
  # of view they are indistinguishable from real cameras.
  # Verified: all at 640x360, 15 fps, keyframe every 3.3s (go2rtc fixes the
  # GOP at 50 frames and it cannot be changed per stream).
  # ffmpeg already ships in the alexxit/go2rtc image; nothing to install.
  #
  # There are five because each pattern costs a different bitrate - each one's
  # was measured by recording 20s of the stream - and that difference is what
  # makes the "Câmeras" screen look like a real installation: the quota
  # disappears fast on one and lasts on another.
  #
  # On a real installation they are useless: delete these lines and put your
  # cameras in their place.

  # Classic test card, with a seconds counter in the middle. ~100 kbps.
  cam_teste1: ffmpeg:virtual?video=testsrc&size=640x360&rate=15#video=h264

  # Colored bars with moving shapes and noise on top: it is the bitrate
  # ceiling, and the one that eats the most CPU to encode. ~870 kbps.
  cam_teste2: ffmpeg:virtual?video=testsrc2&size=640x360&rate=15#video=h264

  # SMPTE bars, a practically still scene: it is the bitrate floor. ~16 kbps.
  cam_teste3: ffmpeg:virtual?video=smptehdbars&size=640x360&rate=15#video=h264

  # Sierpinski fractal, black and white, redrawn frame by frame. ~550 kbps.
  cam_teste4: ffmpeg:virtual?video=sierpinski&size=640x360&rate=15#video=h264

  # The only one with audio: A/V sync test card - a bar that moves along the
  # ruler and a beep with it, so you can see right away whether sound and image
  # are matched. The sound comes out as pcm_alaw 16 kHz mono, the same format as
  # cheap cameras, so it exercises dwnvr's "flac" and "aac" modes without
  # needing a camera with a microphone.
  # ~67 kbps of video + 128 kbps of audio - here the sound costs twice the image.
  #
  # To pick its audio in the camera form: register it first with audio
  # "nenhum" and reopen the form. dwnvr only sees the audio track once the
  # camera is already recording, and before that it leaves "flac" and "aac"
  # disabled.
  #
  # It is the only one that does not use the "ffmpeg:virtual?..." shortcut: it
  # only builds a single-output filter, and this one has two (video and audio).
  # Hence the whole command by hand - the codec options are the same ones
  # go2rtc would use.
  cam_teste5: exec:ffmpeg -hide_banner -re -f lavfi -i avsynctest=size=640x360:framerate=15[out0][out1] -c:v libx264 -g 50 -profile:v high -level:v 4.1 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p -c:a pcm_alaw -ar:a 16000 -ac:a 1 -rtsp_transport tcp -f rtsp {output}

  # Public RTSP streams on the internet, with real imagery: cars, motorcycles
  # and people passing by - which the synthetic ones never show. They are what
  # gives the object detector something to find. They are not live: each one
  # repeats a recorded video, in a loop.
  # Verified: all H264 at 1280x720, no audio, keyframe every 2s.
  #
  # They depend on the internet and on a third-party server
  # (samples.rts.videodb.io), which may go offline or change without notice. If
  # one stops, the synthetic ones above keep recording. On a real installation,
  # delete these lines too.

  # Busy avenue at night, in timelapse. 25 fps, ~1.8 Mbps.
  traffic: rtsp://samples.rts.videodb.io:8554/traffic

  # Camera on a motorcycle handlebar, on the street, with pedestrians, cars and
  # rickshaws. 20 fps, ~1.7 Mbps.
  roadcam: rtsp://samples.rts.videodb.io:8554/roadcam

  # Security camera at a toll plaza, taken from a newscast: between one pass
  # of the loop and the next, the broadcaster's sensitive-content notice
  # appears. 20 fps, ~1.3 Mbps.
  accident: rtsp://samples.rts.videodb.io:8554/accident

  # ---------------------------------------------------------------------------
  # SOME CONFIGURATION EXAMPLES, for your cameras. They are all commented out:
  # uncomment what fits, change the IP, user, password and path - and restart
  # only go2rtc: `docker compose restart go2rtc`. The new camera shows up by
  # itself on dwnvr's "Câmeras" screen, without restarting it.
  # ---------------------------------------------------------------------------

  # Example 1. Regular camera, high and low resolution. Two lines because
  #    almost every camera publishes two streams, and that is what lets you
  #    choose the resolution PER CAMERA in dwnvr's camera form: high to record
  #    the gate, low for the hallway - which directly changes the disk math.
  #
  # cam_iota:       rtsp://usuario:senha@192.168.0.50:554/onvif1
  # cam_iota_baixa: rtsp://usuario:senha@192.168.0.50:554/onvif2

  # Example 2. The path after the IP changes from manufacturer to manufacturer,
  #    and sometimes from firmware to firmware. Find yours in the camera
  #    manual, in its interface, through ONVIF, or in the RTSP URL lists that
  #    circulate per model. The general form is always this:
  #
  # cam_delta: rtsp://usuario:senha@IP:554/PATH
  #
  #    If the password has @, : or /, escape it with percent-encoding (@
  #    becomes %40).

  # Example 3. AAC audio. dwnvr's "aac" mode does not convert anything by
  #    itself: it expects a second source to exist, here, with the audio
  #    already converted. The list makes go2rtc join the two in the same
  #    stream.
  #
  # cam_sala:
  #   - rtsp://usuario:senha@192.168.0.51:554/onvif1
  #   - ffmpeg:cam_sala#audio=aac
  #
  #    The "flac" mode, on the other hand, asks for nothing here - the
  #    conversion happens inside go2rtc, in pure Go. The CPU and disk cost of
  #    each mode is in docs/configuration.md.

  # WARNING about audio: do NOT append "#media=video" to the source if you want
  # to record sound. That filter drops the audio at the source, and no dwnvr
  # setting brings it back. See docs/configuration.md.

  # Everything that can be written in this section - ONVIF, HTTP, USB,
  # backchannel, transport options - is documented in go2rtc, which is the one
  # in charge here:
  # https://github.com/AlexxIT/go2rtc#module-streams
  # https://github.com/AlexxIT/go2rtc/wiki

# The three ports below are the same ones published by the go2rtc service in
# docker-compose.yml. Changing one here without changing it there breaks what
# depends on it.

api:
  # Where dwnvr reads the stream list from and where it consumes the fMP4.
  listen: ":1984"
  # The compose publishes it only to the server itself. If you open it to the
  # network, to use go2rtc's web interface from another machine, set a password
  # here and the same one in go2rtc.username and go2rtc.password of
  # dwnvr.yaml, or dwnvr stops reaching go2rtc. See "Opening go2rtc to the
  # network" in the README.
  # username: admin
  # password: troque-me

rtsp:
  # go2rtc's RTSP server. dwnvr does not use it; it is there for other clients,
  # such as VLC. Also published only to the server itself; if you open it to
  # the network, set a password. The exec:ffmpeg sources above publish here
  # from inside the container and do not need it.
  listen: ":8554"
  # username: admin
  # password: troque-me

webrtc:
  # In "Ao vivo" only the signaling goes through dwnvr - the WebRTC media goes
  # straight from the browser to here, which is why this port must be
  # published.
  listen: ":8555"
