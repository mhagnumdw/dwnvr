# git-cliff config: generates CHANGELOG.md from the git history.
# Docs: https://git-cliff.org/docs/configuration
# Used by the release (.github/workflows/release.yml). Preview of the next
# version:
#   git cliff --unreleased --tag vX.Y.Z
# Suggested number, from the commits since the last tag:
#   git cliff --bumped-version

[changelog]
# STATIC header: `--prepend` recognizes this block and inserts the new releases
# right below it, so it must be identical, byte for byte, to the top of
# CHANGELOG.md (no template variables). The note lives here - single source;
# CHANGELOG.md must not be edited by hand.
header = """
# Changelog

> Generated automatically on release by git-cliff (`.github/workflows/release.yml`); dates in UTC; do not edit by hand.

"""
# One section per release: "## [vX.Y.Z](compare link) (YYYY-MM-DD)" + groups
# (### Added/Fixed/...) + bullets. Before the groups, only when some commit has
# `!`, comes "### Action required on upgrade", with the BREAKING CHANGE: footer
# of each one: the commit subject says what changed, and the footer says what
# to do.
# The first version has nothing to compare against, and listing its whole
# history would take hundreds of lines: a short text takes the place of the
# groups.
# The final blank line separates this release from the previous one; it is only
# emitted if there is a previous release, so the file does not end with 2 blank
# lines (prettier complains).
body = """
{% if version -%}
    ## [{{ version }}]({% if previous.version %}<REPO>/compare/{{ previous.version }}...{{ version }}{% else %}<REPO>/tree/{{ version }}{% endif %}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
    ## Unreleased
{% endif -%}
{% if previous.version or not version %}\
{% for commit in commits | filter(attribute="breaking", value=true) %}\
{% if loop.first %}
    ### Action required on upgrade
{% endif %}
        - {{ commit.breaking_description | split(pat="\n") | join(sep=" ") | trim }} ([{{ commit.id | truncate(length=8, end="") }}](<REPO>/commit/{{ commit.id }}))
{% endfor %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.raw_message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=8, end="") }}](<REPO>/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\
{% else %}
First numbered version. Until now dwnvr shipped only as `latest`, on every commit; from here on each version has its own name, notes and images, and the interface tells you when a new one comes out.
{% endif %}\
{% if previous.version %}\n{% endif %}
"""
trim = true
# They run only on the freshly generated release (the ones already below the
# header stay as they are).
postprocessors = [
  # "(#123)" -> link to the pull request
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](<REPO>/pull/${1}))" },
  { pattern = '<REPO>', replace = "https://github.com/mhagnumdw/dwnvr" },
]

[git]
conventional_commits = true
# Keeps every commit, even those that do not follow Conventional Commits (they
# land in "Other").
filter_commits = false
filter_unconventional = false
sort_commits = "newest"
# Only version tags count as a release; any other tag is ignored.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
    # The release's own commit (chore(release): vX.Y.Z) does not go in the changelog.
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Changed" },
    { message = "^docs", group = "<!-- 4 -->Docs" },
    { message = "^ci|^build", group = "<!-- 5 -->CI/Build" },
    { message = ".*", group = "<!-- 9 -->Other" },
]

# It only feeds the suggestion of `git cliff --bumped-version`: the release
# number is always what is typed into the button.
[bump]
initial_tag = "v0.1.0"
# While the version is 0.x, a feat bumps the minor (0.1.0 -> 0.2.0), not the patch.
features_always_bump_minor = true
# And a breaking change (feat!:) also bumps only the minor: 1.0.0 is the call
# of whoever does the release, not of a `!` in a commit.
breaking_always_bump_major = false
