# Trivy on the latest image of the object detector, once a week.
#
# The dwnvr-detect image has the Debian base of python:*-slim, and the Debian
# package stays at the version of the day the image was built. Dependabot does
# not warn about flaws in image packages, it only bumps the base tag when a new
# Python version comes out; and the tag of a Python patch stops being rebuilt
# when the next one comes out, so it freezes the Debian packages. Trivy reads the
# packages from inside the published image and checks them against the public
# flaw databases.
#
# Only flaws that already have a fix (ignore-unfixed), and only HIGH and
# CRITICAL: the rest has nothing to be done and would become noise. The fix is
# to bump the python tag in dwnvr-detect/Dockerfile and make a release, because
# latest only changes then.
#
# The dwnvr image is left out: it is `scratch` with a Go binary, and what Trivy
# would find in it govulncheck.yml finds with fewer false alarms.
#
# The finding goes to the Security tab, under Code scanning, where it closes by
# itself when the new image no longer has it. And the job fails: GitHub sends an
# e-mail when a scheduled workflow fails.

name: trivy

on:
  schedule:
    - cron: '47 9 * * 1'  # Monday, 09:47 UTC
  workflow_dispatch:
  # The PR that touches this file runs the scan, to prove it works. The scan is
  # of latest, not of what the PR builds.
  pull_request:
    paths: [.github/workflows/trivy.yml]

# No job gets a token with permissions unless it asks for one.
permissions: {}

env:
  # Bumped by hand; the action's is the one from the day it came out. The flaw
  # database comes from the network on every run, so an older Trivy version
  # still sees the new flaws.
  TRIVY_VERSION: v0.76.0

jobs:
  detect-latest:
    runs-on: ubuntu-latest
    # The image is public, and nothing here reads the repository.
    permissions:
      security-events: write  # send the SARIF to Code scanning
    strategy:
      fail-fast: false
      # The two published architectures. The packages usually have the same
      # version on both, but nothing guarantees it.
      matrix:
        arch: [amd64, arm64]
    env:
      IMAGE: ghcr.io/${{ github.repository }}-detect:latest
      TRIVY_PLATFORM: linux/${{ matrix.arch }}
    steps:
      # The action installs Trivy through setup-trivy, which it pins by SHA
      # itself. In March 2026 the tags of both were swapped for malicious code
      # (GHSA-69fq-xp46-6x23); the SHA does not change code.
      - name: scan for Code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # Without this the SARIF carries every severity, and the filter above
          # would only apply to the table.
          limit-severities-for-sarif: true
          format: sarif
          output: trivy.sarif

      # A fork PR does not get a token with write access, and the upload would fail.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: trivy.sarif
          # One category per architecture: the second does not erase the first's
          # alerts.
          category: trivy-detect-${{ matrix.arch }}

      # The same search, now as a table in the log and failing the job. The flaw
      # database and Trivy are already here.
      - name: fail if there is a finding
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
        env:
          TRIVY_SKIP_DB_UPDATE: true
