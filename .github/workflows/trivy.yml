# Trivy na imagem latest do detector de objetos, uma vez por semana.
#
# A imagem do dwnvr-detect tem a base Debian do python:*-slim, e o pacote do
# Debian fica na versão do dia em que a imagem foi construída. O Dependabot não
# avisa de falha em pacote de imagem, só sobe a tag da base quando sai versão
# nova do Python; e a tag de um patch do Python para de ser reconstruída quando
# sai o seguinte, então ela congela os pacotes do Debian. O Trivy lê os pacotes
# de dentro da imagem publicada e cruza com as bases públicas de falhas.
#
# Só a falha que já tem correção (ignore-unfixed), e só HIGH e CRITICAL: o
# resto não tem o que fazer e viraria ruído. A correção é subir a tag do python
# no dwnvr-detect/Dockerfile e fazer uma release, porque a latest só muda nela.
#
# A imagem do dwnvr fica de fora: é `scratch` com um binário em Go, e o que o
# Trivy acharia nela o govulncheck.yml acha com menos alarme falso.
#
# O achado vai para a aba Security, em Code scanning, onde fecha sozinho quando
# a imagem nova não o tem mais. E o job falha: o GitHub manda e-mail quando um
# workflow agendado falha.

name: trivy

on:
  schedule:
    - cron: '47 9 * * 1'  # segunda, 09:47 UTC
  workflow_dispatch:
  # O PR que mexe neste arquivo roda o scan, para provar que ele funciona. O
  # scan é da latest, e não do que o PR constrói.
  pull_request:
    paths: [.github/workflows/trivy.yml]

# Nenhum job recebe token com permissão, a não ser que peça.
permissions: {}

env:
  # Trocada à mão; a da action é a do dia em que ela saiu. A base de falhas vem
  # da rede a cada run, então uma versão mais velha do Trivy ainda enxerga as
  # falhas novas.
  TRIVY_VERSION: v0.76.0

jobs:
  detect-latest:
    runs-on: ubuntu-latest
    # A imagem é pública, e nada aqui lê o repositório.
    permissions:
      security-events: write  # enviar o SARIF ao Code scanning
    strategy:
      fail-fast: false
      # As duas arquiteturas publicadas. Os pacotes costumam ter a mesma versão
      # nas duas, mas nada garante.
      matrix:
        arquitetura: [amd64, arm64]
    env:
      IMAGEM: ghcr.io/${{ github.repository }}-detect:latest
      TRIVY_PLATFORM: linux/${{ matrix.arquitetura }}
    steps:
      # A action instala o Trivy pelo setup-trivy, que ela mesma fixa por SHA.
      # Em março de 2026 as tags das duas foram trocadas por código malicioso
      # (GHSA-69fq-xp46-6x23); o SHA não muda de código.
      - name: scan para o Code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGEM }}
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # Sem isto o SARIF leva toda severidade, e o filtro acima só valeria
          # para a tabela.
          limit-severities-for-sarif: true
          format: sarif
          output: trivy.sarif

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: trivy.sarif
          # Uma categoria por arquitetura: a segunda não apaga os alertas da
          # primeira.
          category: trivy-detect-${{ matrix.arquitetura }}

      # A mesma busca, agora em tabela no log e falhando o job. A base de
      # falhas e o Trivy já estão aqui.
      - name: falha se houver achado
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGEM }}
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
        env:
          TRIVY_SKIP_DB_UPDATE: true
