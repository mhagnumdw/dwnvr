# CI do dwnvr.
#
# O job `test` roda em todo push e pull request. O `image` roda depois dele e
# só fora de pull request, publicando a imagem multi-arch no GHCR.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - run: go vet ./...
      - run: go test ./... -count=1

      - name: gofmt
        run: |
          arquivos=$(gofmt -l .)
          if [ -n "$arquivos" ]; then
            echo "Arquivos mal formatados:"; echo "$arquivos"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # A interface versionada em internal/api/dist precisa corresponder ao
      # código em web/. Esquecer o build produz um binário que compila e sobe
      # normalmente, mas serve a tela antiga - falha silenciosa que só
      # apareceria em produção.
      - name: interface está atualizada?
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run build)
          if ! git diff --quiet internal/api/dist; then
            echo "internal/api/dist está desatualizado."
            echo "Rode 'npm run build' em web/ e faça commit do resultado."
            git diff --stat internal/api/dist
            exit 1
          fi

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      # A mesma versão que o Makefile carimba: a tag quando houver, senão o
      # hash curto - que é o que `git describe --tags --always` devolveria.
      # Precisa ser calculada aqui porque o build da imagem não vê o .git.
      - id: versao
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VERSION=${{ steps.versao.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.versao.outputs.date }}
          # Duas arquiteturas por enquanto: aarch64 (Orange Pi, Raspberry Pi) e
          # x86_64. Outras entram quando houver quem as use.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
