# CI do dwnvr.
#
# O job `test` roda em todo push na main e em todo pull request. Fora de pull
# request, o `imagens` roda depois dele e publica no GHCR as imagens
# multi-arch do dwnvr e do detector de objetos, opcional, com a tag `main`.
# Quem as constrói é o imagens.yml, que a release também chama; a tag de
# versão e o `latest` só saem da release.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nenhum job recebe token com permissão, a não ser que peça.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # ler o código
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # nada aqui faz push

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: go.sum

      # O vet e a formatação ficam no lint.yml, pelo golangci-lint.
      - run: go test ./... -count=1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # A interface versionada em internal/api/dist precisa corresponder ao
      # código em web/. Esquecer o build produz um binário que compila e sobe
      # normalmente, mas serve a tela antiga - falha silenciosa que só
      # apareceria em produção.
      - name: interface está atualizada?
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run build)
          if ! git diff --quiet internal/api/dist; then
            echo "internal/api/dist está desatualizado."
            echo "Rode 'npm run build' em web/ e faça commit do resultado."
            git diff --stat internal/api/dist
            exit 1
          fi

  imagens:
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/imagens.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
