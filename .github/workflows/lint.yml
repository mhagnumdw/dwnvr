# Lint do dwnvr: roda na CI, com o prek, o mesmo .pre-commit-config.yaml do
# commit local, em todos os arquivos.
#
# Aqui nada é corrigido. Se um hook mudaria algum arquivo, o job falha e o
# --show-diff-on-failure mostra o diff; a correção se faz no clone, com
# `prek run --all-files`, e vai num commit.
#
# Fica fora do ci.yml de propósito: lint vermelho avisa, mas não segura a
# publicação das imagens, e a release só confere o ci.yml.

name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nenhum job recebe token com permissão, a não ser que peça.
permissions: {}

# Um push novo no mesmo PR cancela o lint do anterior, que já não vale. Na
# main, cada push termina o seu.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    runs-on: ubuntu-latest
    # Leva ~40 s, e ~2 min com o cache frio. Sem isto, um hook travado
    # prenderia o runner por 6 h.
    timeout-minutes: 15
    permissions:
      contents: read  # ler o código
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nada aqui faz push
          fetch-depth: 0  # o histórico inteiro, para o betterleaks

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: python
        with:
          python-version: '3.x'

      # O Go do `go mod tidy`. O golangci-lint e o betterleaks usam o Go que o
      # prek baixa, o do default_language_version do config.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: go.sum

      # O svelte-check e o ESLint vêm do web/node_modules.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Sem os scripts de instalação dos pacotes: o lint só lê o
      # node_modules, e nenhum pacote roda código na instalação.
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: web

      # Os ambientes dos hooks, que o prek monta na primeira execução, e o Go
      # que ele baixa para eles. Mudou o .pre-commit-config.yaml, monta de novo.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # A versão do minimum_prek_version do config.
      - name: instalar o prek
        run: pip install "prek==$(awk '$1 == "minimum_prek_version:" { gsub(/\047/, "", $2); print $2 }' .pre-commit-config.yaml)"

      # O betterleaks olha só o staged, e aqui não há staged. Com o token, o
      # zizmor liga os audits que consultam o GitHub (action com
      # vulnerabilidade conhecida, commit impostor, tag ambígua); sem ele, roda
      # offline, como no clone. O token só lê o código, que já é público.
      - name: prek
        run: prek run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: betterleaks
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}

      # O betterleaks no histórico inteiro: o commit que não passou pelo hook
      # não passa por aqui.
      - name: betterleaks no histórico
        if: ${{ !cancelled() }}
        run: prek run betterleaks-historico --stage manual --all-files --color=always
