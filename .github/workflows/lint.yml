# Lint do dwnvr: roda na CI o mesmo .pre-commit-config.yaml do commit local,
# em todos os arquivos.
#
# Aqui nada é corrigido. Se um hook mudaria algum arquivo, o job falha e o
# --show-diff-on-failure mostra o diff; a correção se faz no clone, com
# `pre-commit run --all-files`, e vai num commit.
#
# Fica fora do ci.yml de propósito: lint vermelho avisa, mas não segura a
# publicação das imagens, e a release só confere o ci.yml.

name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nenhum job recebe token com permissão, a não ser que peça.
permissions: {}

# Um push novo no mesmo PR cancela o lint do anterior, que já não vale. Na
# main, cada push termina o seu.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    # Leva ~1 min, e ~2 min com o cache frio. Sem isto, um hook travado
    # prenderia o runner por 6 h.
    timeout-minutes: 15
    permissions:
      contents: read  # ler o código
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # nada aqui faz push
          fetch-depth: 0  # o histórico inteiro, para o betterleaks

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.x'

      # O golangci-lint é compilado pelo pre-commit com este Go, e analisa o
      # código com ele.
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: '1.27'
          cache-dependency-path: go.sum

      # O svelte-check e o ESLint vêm do web/node_modules.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Sem os scripts de instalação dos pacotes: o lint só lê o
      # node_modules, e nenhum pacote roda código na instalação.
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: web

      # Os ambientes dos hooks, que o pre-commit monta na primeira execução.
      # Mudou o .pre-commit-config.yaml, monta de novo. Mudou o Go também: o
      # golangci-lint compilado com um Go mais velho que o do go.mod se recusa
      # a rodar.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # A mesma versão do asdf local.
      - name: instalar o pre-commit
        run: pip install "pre-commit==$(awk '$1 == "pre-commit" { print $2 }' .tool-versions)"

      # O betterleaks olha só o staged, e aqui não há staged. Com o token, o
      # zizmor liga os audits que consultam o GitHub (action com
      # vulnerabilidade conhecida, commit impostor, tag ambígua); sem ele, roda
      # offline, como no clone. O token só lê o código, que já é público.
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: betterleaks
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}

      # O betterleaks no histórico inteiro: o commit que não passou pelo hook
      # não passa por aqui.
      - name: betterleaks no histórico
        if: ${{ !cancelled() }}
        run: pre-commit run betterleaks-historico --hook-stage manual --all-files --color=always
