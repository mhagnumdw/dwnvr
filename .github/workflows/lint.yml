# dwnvr lint: runs in CI, with prek, the same .pre-commit-config.yaml as the
# local commit, on all files.
#
# Nothing is fixed here. If a hook would change a file, the job fails and
# --show-diff-on-failure shows the diff; the fix is made in the clone, with
# `prek run --all-files`, and goes in a commit.
#
# It stays out of ci.yml on purpose: a red lint warns, but does not hold back
# publishing the images, and the release only checks ci.yml.

name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job gets a token with permissions unless it asks for one.
permissions: {}

# A new push to the same PR cancels the previous one's lint, which no longer
# applies. On main, every push finishes its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    runs-on: ubuntu-latest
    # Takes ~40 s, and ~2 min with a cold cache. Without this, a stuck hook
    # would hold the runner for 6 h.
    timeout-minutes: 15
    permissions:
      contents: read  # read the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes
          fetch-depth: 0  # the whole history, for betterleaks

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: python
        with:
          python-version: '3.x'

      # The Go for `go mod tidy`. golangci-lint and betterleaks use the Go that
      # prek downloads, the one from the config's default_language_version.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: go.sum

      # svelte-check, tsc, ESLint and Prettier come from web/node_modules.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Without the packages' install scripts: the lint only reads
      # node_modules, and no package runs code on install.
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: web

      # The hook environments, which prek builds on the first run, and the Go
      # it downloads for them. If .pre-commit-config.yaml changed, rebuild.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The version of the config's minimum_prek_version.
      - name: install prek
        run: pip install "prek==$(awk '$1 == "minimum_prek_version:" { gsub(/\047/, "", $2); print $2 }' .pre-commit-config.yaml)"

      # betterleaks only looks at what is staged, and here nothing is staged.
      # ui-up-to-date is the "is the UI up to date?" step of ci.yml,
      # which already runs it with the full `npm ci` and points to
      # docs/github.md on the Dependabot PR. With the token, zizmor turns on the
      # audits that query GitHub (action with a known vulnerability, impostor
      # commit, ambiguous tag); without it, it runs offline, as in the clone. The
      # token only reads the code, which is already public.
      - name: prek
        run: prek run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: betterleaks,ui-up-to-date
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}

      # betterleaks on the whole history: a commit that did not go through the
      # hook does not get past here.
      - name: betterleaks on the history
        if: ${{ !cancelled() }}
        run: prek run betterleaks-history --stage manual --all-files --color=always
