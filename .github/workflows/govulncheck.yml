# govulncheck on the binary of the latest release, once a week.
#
# govulncheck is Go's official tool for finding known security flaws. From
# inside the binary it reads the Go version and the dependencies it was built
# with, and checks them against Go's public flaw database
# (https://vuln.go.dev). It does not stop at "this version has a flaw": it
# checks whether dwnvr actually calls the affected function, and only reports
# when it does. That is why it almost never raises a false alarm.
#
# Dependabot looks at go.mod, not at the Go version that built the binary;
# govulncheck looks at both.
#
# It runs on the published binary, not on the source: on the source, with the
# newest Go of the day, it would come out clean even when the release was built
# with a patch that has the flaw. If it reports something in the stdlib, the fix
# is a new release, because the golang:1.27-alpine tag in the Dockerfile only
# picks up the new patch in a new build.
#
# Failing is the warning: GitHub sends an e-mail when a scheduled workflow
# fails.

name: govulncheck

on:
  schedule:
    - cron: '17 9 * * 1'  # Monday, 09:17 UTC
  workflow_dispatch:

# No job gets a token with permissions unless it asks for one.
permissions: {}

env:
  # Bumped by hand. The flaw database comes from the network on every run, so an
  # older govulncheck version still sees the new flaws.
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  latest:
    runs-on: ubuntu-latest
    # The image is public, and nothing here reads the repository.
    permissions: {}
    steps:
      # The Go here only builds govulncheck; the version that matters is the one
      # recorded in the binary.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache: false

      - run: go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"

      - name: binary of the latest image
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY:latest"
          docker pull -q "$image"
          id=$(docker create "$image")
          docker cp -q "$id:/dwnvr" ./dwnvr
          docker rm "$id" > /dev/null
          go version ./dwnvr

      - run: |
          "$(go env GOPATH)/bin/govulncheck" -mode=binary ./dwnvr
