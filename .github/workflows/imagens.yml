# The multi-arch images of dwnvr and of the object detector, published to GHCR.
#
# It is a reusable workflow (workflow_call), called like a function: by ci.yml
# on every push to main and by the release, which publishes a version. It cannot
# live inside ci.yml waking up on `on: push: tags`, because the release pushes
# the tag with GITHUB_TOKEN, and GitHub does not let what that key does trigger
# another workflow - that is its guard against infinite loops. The tag would
# arrive and nobody would build the image.
#
# Tags of each call:
#   push to main   main, sha-xxxxxxx
#   release        vX.Y.Z, latest, main, sha-xxxxxxx
#   pull request   none: builds both images and does not publish
#
# The jobs do not declare `permissions`: they inherit the caller's. A called
# workflow cannot ask for more than it received, and the pull request, which
# does not publish, calls with `contents: read` only. Whoever publishes also
# passes `packages: write`.

name: imagens

on:
  workflow_call:
    inputs:
      ref:
        description: the commit or the tag to build
        type: string
        required: true
      release:
        description: adds the latest and vX.Y.Z tags (the ref itself)
        type: boolean
        default: false
      push:
        description: publishes to GHCR; false only checks that the images build
        type: boolean
        default: true

env:
  IMAGE_DWNVR_RECORDER: ghcr.io/${{ github.repository }}
  IMAGE_DWNVR_DETECT: ghcr.io/${{ github.repository }}-detect

jobs:
  image-dwnvr-recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The git describe below needs the tags and the path to them.
          fetch-depth: 0
          persist-credentials: false  # nothing here pushes
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same version the Makefile stamps: `git describe` gives the tag on a
      # release commit, `v0.1.0-3-gabc1234` on the commits after it and the
      # short hash while there is no tag at all. It must be computed here
      # because the image build does not see .git.
      #
      # The commit also comes from the checkout, not from github.sha: in a
      # release, github.sha is the commit from before the CHANGELOG, not the one
      # that becomes the image.
      - id: versao
        run: |
          {
            echo "version=$(git describe --tags --always)"
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # context: git takes the sha and the labels from the checkout, for the same
      # reason as the commit above. latest is only born from a release: with the
      # action's default (latest=auto) it would show up by itself on any semver
      # tag.
      #
      # Without publishing, tag and label are no use, and the pull request would
      # not even be able to compute them: the checkout is of the merge commit,
      # with a detached HEAD, and `context: git` fails with "Cannot infer ref
      # from detached HEAD".
      - id: meta
        if: inputs.push
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          context: git
          images: ${{ env.IMAGE_DWNVR_RECORDER }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.ref }},enable=${{ inputs.release }}
            type=raw,value=latest,enable=${{ inputs.release }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          build-args: |
            VERSION=${{ steps.versao.outputs.version }}
            COMMIT=${{ steps.versao.outputs.commit }}
            DATE=${{ steps.versao.outputs.date }}
          # Two architectures for now: aarch64 (Orange Pi, Raspberry Pi) and
          # x86_64. Others come in when there is someone who uses them.
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The pull request reads the main cache and does not write: its own
          # would only serve itself and push main's out of the quota.
          cache-from: type=gha,scope=dwnvr-recorder
          cache-to: ${{ inputs.push && 'type=gha,scope=dwnvr-recorder,mode=max' || '' }}

  # The object detector, in dwnvr-detect/. Same mold as
  # `image-dwnvr-recorder`: its Dockerfile does not run anything of the target
  # architecture either, so arm64 comes out of here without emulation. Each job
  # has its own cache scope so one does not compete with the other for space.
  # The tags are the same as dwnvr's, and that is what lets a single
  # DWNVR_VERSION in the .env pick both images.
  image-dwnvr-detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # There is no git describe here, but the metadata-action's `context: git`
          # needs a branch or tag pointing at HEAD. In the shallow clone HEAD is
          # detached and it fails with "Cannot infer ref from detached
          # HEAD".
          fetch-depth: 0
          persist-credentials: false  # nothing here pushes
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skipped without publishing, as in image-dwnvr-recorder.
      - id: meta
        if: inputs.push
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          context: git
          images: ${{ env.IMAGE_DWNVR_DETECT }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.ref }},enable=${{ inputs.release }}
            type=raw,value=latest,enable=${{ inputs.release }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: dwnvr-detect
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dwnvr-detect
          cache-to: ${{ inputs.push && 'type=gha,scope=dwnvr-detect,mode=max' || '' }}
