# dwnvr release: Actions > release > Run workflow, with the version (X.Y.Z).
#
# Three jobs, in this order:
#   prepare    checks that a release is possible; writes CHANGELOG.md and the
#              default in docker-compose.yml; commit, tag vX.Y.Z and push of both
#   images     images.yml from the tag: vX.Y.Z, latest, main and sha-*
#   publish    the release page on GitHub, with the git-cliff notes
#
# The page comes last because it is the announcement: it is what lights up the
# new-version notice in the UI of those already running dwnvr, and it can only
# exist after the images. If the images fail, the commit and the tag are already
# on main and "Re-run failed jobs" is enough - there is nothing to undo in git.
#
# The images are called from in here, and not by ci.yml listening for the tag:
# a push made with GITHUB_TOKEN does not trigger another workflow (see
# images.yml).

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (X.Y.Z, without the v). Suggestion: git cliff --bumped-version'
        required: true

# No job gets a token with permissions unless it asks for one.
permissions: {}

# Two releases at the same time would fight over the push to main and the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push of the release commit and the tag
      actions: read  # check the commit's CI
    # Never interpolate ${{ inputs.version }} inside run:, it would become shell
    # code.
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: version in the X.Y.Z format
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: '$VERSION'. Use X.Y.Z, without the v."
            exit 1
          fi

      - name: released from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::A release only comes from main, and this run is from $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # git-cliff needs the whole history and the tags
          persist-credentials: true  # the release push, below, reuses the credential

      - name: new tag, greater than the last one, with a new commit since it
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::The tag v$VERSION already exists."
            exit 1
          fi
          ultima=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$ultima" ]; then
            echo "Primeira release."
            exit 0
          fi
          maior=$(printf '%s\n%s\n' "$ultima" "v$VERSION" | sort -V | tail -n1)
          if [ "$maior" != "v$VERSION" ]; then
            echo "::error::v$VERSION is not greater than the last release, $ultima."
            exit 1
          fi
          if [ "$(git rev-list --count "$ultima..HEAD")" -eq 0 ]; then
            echo "::error::Nenhum commit desde $ultima."
            exit 1
          fi

      # The release publishes exactly this commit, so its CI (tests and main
      # images) must have finished green.
      - name: green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verdes=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$verdes" -eq 0 ]; then
            echo "::error::The CI of $GITHUB_SHA did not finish green (or is still running). See Actions > ci."
            exit 1
          fi

      - name: configure git
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

      - name: CHANGELOG.md
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4.9.1
        with:
          args: --unreleased --prepend CHANGELOG.md
        env:
          GIT_CLIFF_TAG: v${{ inputs.version }}
          # Outside the workspace, so the action's standard output stays out of
          # the commit.
          OUTPUT: ${{ runner.temp }}/cliff-output.md

      # Each version's compose points to its images. There are two lines, the
      # dwnvr one and the dwnvr-detect one; if sed does not change exactly the two,
      # the format changed and the release stops here, before any push.
      - name: docker-compose.yml at the new version
        run: |
          padrao='image: ghcr\.io/mhagnumdw/dwnvr(-detect)?:\$\{DWNVR_VERSION:-[^}]+\}$'
          antes=$(grep -cE "$padrao" docker-compose.yml || true)
          if [ "$antes" -ne 2 ]; then
            echo "::error::Esperava 2 linhas 'image: ...:\${DWNVR_VERSION:-...}' no docker-compose.yml, achei $antes."
            exit 1
          fi
          sed -i -E "s#^(\s*image: ghcr\.io/mhagnumdw/dwnvr(-detect)?:\\\$\{DWNVR_VERSION:-)[^}]+\}\$#\1v${VERSION}}#" docker-compose.yml
          depois=$(grep -cF ":\${DWNVR_VERSION:-v${VERSION}}" docker-compose.yml || true)
          if [ "$depois" -ne 2 ]; then
            echo "::error::sed changed $depois lines, not 2."
            git diff docker-compose.yml
            exit 1
          fi
          git diff docker-compose.yml

      - name: commit and tag
        run: |
          git add CHANGELOG.md docker-compose.yml
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "chore(release): v$VERSION"

      # Atomic: either the commit and the tag both go up, or neither does.
      - name: push
        run: git push --atomic origin HEAD:main "v$VERSION"

  images:
    needs: prepare
    uses: ./.github/workflows/images.yml
    with:
      ref: v${{ inputs.version }}
      release: true
    permissions:
      contents: read
      packages: write

  publish:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4.9.1
        with:
          args: --latest --strip all
        env:
          OUTPUT: ${{ runner.temp }}/notas.md

      # The fixed footer of every release. Only the link: the command lives in the
      # README, and a copy of it here would age unnoticed.
      - name: how to update
        run: |
          printf '\n---\n\n**How to update:** see [Updating in the README](https://github.com/mhagnumdw/dwnvr#updating).\n' >> "$RUNNER_TEMP/notas.md"

      # --verify-tag fails if the tag is not on GitHub, instead of creating it.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          gh release create "v$VERSION"
          --title "v$VERSION"
          --notes-file "$RUNNER_TEMP/notas.md"
          --latest
          --verify-tag
