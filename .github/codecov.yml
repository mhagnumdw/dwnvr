# Codecov config, which it reads on its own from this path. The upload comes
# from .github/workflows/coverage.yml, and the status and the PR comment come
# from the Codecov app installed on the repository (see docs/github.md).
#
# Coverage is there to look at, not to block: the commit or PR that lowers it
# gets the number in the status, but doesn't turn red. The PR comment uses the
# Codecov default.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
