# Rules for zizmor, which audits the workflows' security.
rules:
  unpinned-uses:
    config:
      # A tag can be moved to other code; a SHA can't. Every action is pinned
      # by SHA, with the version in a comment that Dependabot updates with it.
      policies:
        "*": hash-pin
  # `uses: $/...` doesn't pass actionlint, which doesn't know it yet
  # (rhysd/actionlint#711). And here `./` only calls images.yml at the job
  # level, where there is no checkout that could swap the file first.
  self-repository:
    disable: true
