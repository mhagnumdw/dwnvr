# Version updates by Dependabot: one PR per month and per ecosystem.
#
# The security update does not depend on this file and arrives off the
# calendar, when a fix is released. What to do with each PR is in
# docs/github.md.
#
# The cooldown waits for the version to be 7 days old before proposing it: a
# compromised release is usually pulled before that. It does not delay the
# security update.
#
# `build(deps):` is the prefix cliff.toml puts under CI/Build in the release
# notes; without it, the default "Bump ..." lands in Other.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # svelte-check only accepts TypeScript 5 and 6 (peerDependencies). Remove
      # when a version of it accepts 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The @types/node major is that of the Node that runs (node:24-alpine and
      # CI's node-version); above it, tsc accepts APIs Node does not have. It
      # goes up together with Node, per the "Go or Node version" line in
      # AGENTS.md §Ripple effects.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      npm:
        patterns: ["*"]

  # Security updates only. The versions in requirements.in are the ones that
  # exported the .onnx and measured the delivery, and changing one requires
  # checking again. And Dependabot swaps the requirements.txt line instead of
  # recompiling with uv, which breaks the file; its PR serves as a warning.
  - package-ecosystem: pip
    directory: /dwnvr-detect
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directories: [/, /dwnvr-detect]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Patch only: requirements.txt is compiled for Python 3.12.
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
      # The tag already floats on the patch (1.27-alpine, 24-alpine). Bumping the
      # version means changing every place in the "Go or Node version" line of
      # AGENTS.md §Ripple effects, and Dependabot would only touch the
      # Dockerfile.
      - dependency-name: golang
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-minor, version-update:semver-major]
    groups:
      docker:
        patterns: ["*"]

  # The `rev`s of .pre-commit-config.yaml, which is prek's config.
  #
  # No docker-compose: Dependabot does not read an image with `${VAR:-...}` in
  # the tag, and the go2rtc in docker-compose.yml is bumped by hand.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The lychee that runs is the image pinned in the hook's `entry`, which
      # Dependabot does not read; the `rev` only brings the hook definition. And
      # the prefixed `rev` (lychee-v0.24.2) breaks the run: Dependabot only
      # strips a leading `v` and compares the new version with nil. lychee is
      # bumped by hand, in the `rev` and the `entry` together.
      - dependency-name: https://github.com/lycheeverse/lychee
    groups:
      pre-commit:
        patterns: ["*"]
