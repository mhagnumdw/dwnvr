# Atualização de versão pelo Dependabot: um PR por mês e por ecossistema.
#
# O security update não depende deste arquivo e chega fora do calendário,
# quando sai uma correção. O que fazer com cada PR está no docs/github.md.
#
# O cooldown espera a versão ter 7 dias antes de propor: release comprometida
# costuma ser retirada antes disso. Não atrasa o security update.
#
# `build(deps):` é o prefixo que o cliff.toml põe em CI/Build nas notas da
# release; sem ele, o "Bump ..." padrão cai em Other.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # O svelte-check só aceita TypeScript 5 e 6 (peerDependencies). Tirar
      # quando uma versão dele aceitar o 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm:
        patterns: ["*"]

  # Os testes ponta a ponta. O PR que sobe o @playwright/test troca também o
  # navegador que ele baixa: o e2e/testes/codecs.spec.ts diz, no próprio PR,
  # se o navegador novo ainda toca H.264.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # O typescript-eslint só aceita TypeScript abaixo do 6.1
      # (peerDependencies). Tirar quando uma versão dele aceitar o 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      e2e:
        patterns: ["*"]

  # Só security update. As versões do requirements.in são as que exportaram o
  # .onnx e mediram a entrega, e trocar uma exige conferir de novo. E o
  # Dependabot troca a linha do requirements.txt em vez de recompilar com o
  # uv, o que quebra o arquivo; o PR dele serve de aviso.
  - package-ecosystem: pip
    directory: /dwnvr-detect
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directories: [/, /dwnvr-detect]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Só patch: o requirements.txt é compilado para o Python 3.12.
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
      # A tag já flutua no patch (1.27-alpine, 24-alpine). Subir de versão é
      # trocar em todos os lugares da linha "versão de Go ou de Node" das
      # Repercussões do AGENTS.md, e o Dependabot só mexeria no Dockerfile.
      - dependency-name: golang
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-minor, version-update:semver-major]
    groups:
      docker:
        patterns: ["*"]

  # Os `rev` do .pre-commit-config.yaml, que é o config do prek.
  #
  # Sem docker-compose: o Dependabot não lê imagem com `${VAR:-...}` na tag, e
  # o go2rtc do docker-compose.yml sobe à mão.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # O lychee que roda é a imagem fixada no `entry` do hook, que o
      # Dependabot não lê; o `rev` só traz a definição do hook. E o `rev` com
      # prefixo (lychee-v0.24.2) derruba o run: o Dependabot só tira o `v` do
      # começo e compara a versão nova com nil. O lychee sobe à mão, no `rev`
      # e no `entry` juntos.
      - dependency-name: https://github.com/lycheeverse/lychee
    groups:
      pre-commit:
        patterns: ["*"]
