# Regras do golangci-lint, lidas pelo hook do prek (e por ele na CI) e pelo
# editor.
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck e unused.
  default: standard
  # Go mais moderno e idiomático, quase tudo com fix automático.
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - intrange
    - modernize
    - noctx
    - nolintlint
    - perfsprint
    - unconvert
    - usestdlibvars
  exclusions:
    # Não cobra o erro de Close, Flush e afins, e cala os falsos positivos
    # conhecidos.
    presets:
      - std-error-handling
      - common-false-positives
    # O ./... também desce nos node_modules (o do web/ e o do e2e/): o
    # flatted, do npm, traz um pacote Go.
    paths:
      - (^|/)node_modules/
    rules:
      # Nos testes a requisição vai para um httptest local: context ali é
      # ruído.
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
