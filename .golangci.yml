# Regras do golangci-lint, lidas pelo hook do pre-commit (e por ele na CI) e
# pelo editor.
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck e unused.
  default: standard
  exclusions:
    # Não cobra o erro de Close, Flush e afins, e cala os falsos positivos
    # conhecidos.
    presets:
      - std-error-handling
      - common-false-positives

formatters:
  enable:
    - gofmt
    - goimports
