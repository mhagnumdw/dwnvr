# golangci-lint rules, read by the prek hook (and by it in CI) and by the
# editor.
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck e unused.
  default: standard
  # More modern, idiomatic Go, almost all with an automatic fix.
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - intrange
    - modernize
    - noctx
    - nolintlint
    - perfsprint
    - unconvert
    - usestdlibvars
  exclusions:
    # Does not demand the error from Close, Flush and the like, and silences
    # the known false positives.
    presets:
      - std-error-handling
      - common-false-positives
    # ./... also descends here: npm's flatted ships a Go package.
    paths:
      - web/node_modules
    rules:
      # In tests the request goes to a local httptest: a context there is
      # noise.
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
