# markdownlint-cli2 rules, read by the prek hook (and by it in CI) and by the
# VS Code markdownlint extension.

config:
  default: true
  # No trailing spaces, not even for a forced line break.
  MD009:
    strict: true
  # Tabs are forbidden only outside code blocks: Go is indented with tabs.
  MD010:
    code_blocks: false
  # No line limit: tables and links go past any limit.
  MD013: false
  # A repeated heading only conflicts between siblings.
  MD024:
    siblings_only: true
  # HTML only for the collapsible block. The <b> is the bold inside <summary>,
  # where ** does not work.
  MD033:
    allowed_elements:
      - details
      - summary
      - b

globs:
  - "**/*.md"

gitignore: true
ignores:
  # Written by the release (git-cliff), which leaves a blank line at the end.
  - CHANGELOG.md
