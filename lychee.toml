# lychee rules (https://lychee.cli.rs/), read by the prek hook (and by it in
# CI). lychee loads this file on its own when it runs at the root.

# Local links only (file, image and anchor), no network: an external link
# breaks for reasons unrelated to the commit.
offline = true

# Also checks the anchor (#section), including one that points to another file.
include_fragments = "anchor-only"

# Run by hand on a directory (`lychee .`), it looks at Markdown only.
extensions = ["md"]

no_progress = true
